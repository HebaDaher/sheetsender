<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1d2433; --muted: #5d6677; --line: #dfe3ea;
    --accent: #0f6e5c; --accent-ink: #ffffff; --accent-soft: #e3f2ee;
    --ok: #1f7a3a; --ok-soft: #e4f4e8; --warn: #8a5a00; --warn-soft: #fff4dc;
    --bad: #b42318; --bad-soft: #fde8e6; --info-soft: #e8eef9; --info: #1e4fa3;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .hidden { display: none !important; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .logo { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); }
  .who { color: var(--muted); font-size: 14px; text-align: right; }
  .who { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
  .ws-sel { width: auto; max-width: 260px; padding: 6px 8px; font-size: 14px; }
  .ws-name { font-weight: 600; color: var(--ink); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode { text-align: left; cursor: pointer; border: 2px solid var(--line); background: var(--card); border-radius: var(--radius);
    padding: 12px 14px; font: inherit; color: var(--ink); }
  .shop-card.add-shop { border-style: dashed; cursor: default; display: flex; flex-direction: column; justify-content: center; }
  .login-card { max-width: 460px; margin: 40px auto; text-align: center; }
  .logo-big { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 28px; margin-bottom: 8px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; }
  .gbtn .g { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #4285f4; font-weight: 700; }
  .mode b { display: block; font-size: 16px; margin-bottom: 2px; }
  .mode span { color: var(--muted); font-size: 13px; }
  .mode.active { border-color: var(--accent); background: var(--accent-soft); }
  .mode:focus-visible { outline: 3px solid var(--accent-soft); }
  @media (max-width: 640px) { .modes { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; } .who { justify-content: flex-start; } }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 4px 0 4px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  h3 { font-size: 17px; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  a { color: var(--info); }

  .banner { max-width: 1100px; margin: 12px auto 0; padding: 12px 16px; border-radius: var(--radius);
    font-weight: 500; white-space: pre-line; }
  .banner.error { background: var(--bad-soft); color: var(--bad); border: 1px solid #f3b8b2; }
  .banner.success { background: var(--ok-soft); color: var(--ok); border: 1px solid #b5dfc0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .notice { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; white-space: pre-line; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #f0d9a6; }
  .notice.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid #f3b8b2; }
  .notice.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid #b5dfc0; }
  .notice.info { background: var(--info-soft); color: var(--info); border: 1px solid #c7d6f2; }

  .shops { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .shop-card { text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); padding: 18px; font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .shop-card:hover, .shop-card:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
  .shop-card .name { font-size: 19px; font-weight: 700; margin-bottom: 4px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 16px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 14px;
    border-bottom: 3px solid transparent; cursor: pointer; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--line); color: var(--ink); font-size: 13px; margin-right: 6px; }
  .tab.active .num { background: var(--accent); color: var(--accent-ink); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600;
    padding: 9px 16px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.big { font-size: 18px; padding: 14px 26px; }
  .btn.danger { color: var(--bad); }
  .btn.wa { background: #1f9d55; color: #fff; border-color: #1f9d55; }
  .btn.small { padding: 5px 10px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .link { background: none; border: 0; padding: 0; color: var(--info); font: inherit; cursor: pointer; text-decoration: underline; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=search], select, textarea { width: 100%; font: inherit; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  textarea { min-height: 170px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .check input { margin-top: 5px; width: 18px; height: 18px; }

  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 26px; text-align: center; background: #fafbfc; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

  .map-grid { display: grid; grid-template-columns: 200px 1fr; gap: 8px 14px; align-items: center; }
  @media (max-width: 560px) { .map-grid { grid-template-columns: 1fr; } }
  .req { color: var(--bad); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f0f2f6; font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  .scroll { max-height: 520px; overflow: auto; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .b-sent, .b-ok, .b-completed { background: var(--ok-soft); color: var(--ok); }
  .b-pending, .b-running { background: var(--info-soft); color: var(--info); }
  .b-skipped, .b-cancelled, .b-paused, .b-stopped, .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-failed, .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-opened_in_whatsapp { background: #e1f5e9; color: #1f7a3a; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .stat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 14px; }

  .email-preview { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .email-preview .meta { background: #f0f2f6; padding: 10px 14px; font-size: 14px; }
  .email-preview .meta div { margin: 2px 0; }
  .email-preview .body { padding: 14px; white-space: pre-wrap; }
  .wa-bubble { background: #dcf8c6; border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; max-width: 520px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  /* Upload history and "Who gets it?" */
  .lists { display: flex; flex-direction: column; gap: 8px; }
  .list-row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .list-main { flex: 1 1 260px; min-width: 0; word-break: break-word; }
  .list-actions { gap: 6px; flex-wrap: wrap; }
  .link.small { font-size: 13px; }
  .danger-link { color: var(--bad); }
  .aud { margin-bottom: 12px; }
  .aud-lists { margin: 0 0 0 26px; padding: 4px 10px; border-left: 3px solid var(--line); }
  .aud-lists .check { margin: 4px 0; }
  .media-pick { margin: 10px 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
  .media-thumb { max-width: 160px; max-height: 120px; border-radius: 6px; display: block; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }

  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin-bottom: 4px; }

  .busy { position: fixed; inset: 0; background: rgba(20, 25, 35, .35); display: grid; place-items: center; z-index: 50; }
  .busy-box { background: #fff; border-radius: var(--radius); padding: 22px 28px; text-align: center; min-width: 240px; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-page { text-align: center; padding: 80px 0; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 46px; height: 26px; border-radius: 999px; background: #c9ced8; position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 23px; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sched { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: #fafbfc; }
  .sched .opt { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .sched input[type=number] { width: 90px; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; }
  .sched input[type=datetime-local] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; max-width: 100%; }
</style>
