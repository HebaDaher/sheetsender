<style>
  /* ------------------------------------------------------------------
     Design system: one set of colours, spacing, type sizes, radii and
     control heights, used by every screen.
     Spacing scale: 4 · 8 · 12 · 16 · 24 · 32.  Type: 13 · 14 · 16 · 18 · 20 · 26.
     ------------------------------------------------------------------ */
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #18202e; --muted: #556072; --line: #d9dee6; --line-soft: #eceff3; --head: #f1f3f7;
    --accent: #0d6b59; --accent-ink: #ffffff; --accent-soft: #dff1ec; --accent-strong: #0a5647;
    --ok: #1b6e35; --ok-soft: #e3f3e7; --ok-line: #b0dbbd;
    --warn: #7a4f00; --warn-soft: #fff3d6; --warn-line: #efd394;
    --bad: #b02016; --bad-soft: #fde9e7; --bad-line: #f1b4ae;
    --info: #1c4a99; --info-soft: #e7eefa; --info-line: #c3d3f0;
    --wa: #17834a;
    --radius: 12px; --radius-sm: 8px;
    --h-control: 40px; --h-control-sm: 34px; --h-control-lg: 48px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --content: 1100px;
    --focus: 0 0 0 3px rgba(13, 107, 89, .35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; overflow-wrap: anywhere; }
  .hidden { display: none !important; }
  img, video { max-width: 100%; }

  /* Keyboard focus: always visible */
  :focus-visible { outline: none; box-shadow: var(--focus); }
  a:focus-visible, .link:focus-visible { border-radius: 4px; }

  /* ---------------- Top bar ---------------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s5); background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: var(--s2); white-space: nowrap; }
  .logo { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm);
    background: var(--accent); color: var(--accent-ink); }
  .who { color: var(--muted); font-size: 14px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: var(--s2); min-width: 0; }
  .who .small { overflow-wrap: anywhere; }
  .ws-sel { width: auto; max-width: 260px; min-height: var(--h-control-sm); padding: 4px 8px; font-size: 14px; }
  .ws-name { font-weight: 600; color: var(--ink); }

  /* ---------------- Page frame ---------------- */
  main { max-width: var(--content); margin: 0 auto; padding: var(--s5) var(--s4) 64px; }
  h1 { font-size: 26px; line-height: 1.25; margin: var(--s1) 0 var(--s1); }
  h2 { font-size: 20px; line-height: 1.3; margin: 0 0 var(--s2); }
  h3 { font-size: 18px; line-height: 1.35; margin: 0 0 var(--s2); }
  p { margin: 0 0 var(--s3); }
  ul, ol { margin: 0 0 var(--s3); padding-left: 22px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  a { color: var(--info); }
  code { font-size: 13px; background: var(--head); padding: 1px 5px; border-radius: 4px; }
  details > summary { cursor: pointer; min-height: 32px; display: list-item; padding: 4px 0; }
  details > summary:focus-visible { border-radius: 4px; }

  /* ---------------- Messages (banner + notices) ---------------- */
  .banner { max-width: calc(var(--content) - 2 * var(--s4)); margin: var(--s3) auto 0; padding: var(--s3) var(--s4); border-radius: var(--radius);
    font-weight: 500; white-space: pre-line; border: 1px solid transparent; }
  @media (max-width: 1132px) { .banner { margin-left: var(--s4); margin-right: var(--s4); } }
  .banner.error { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
  .banner.error::before { content: "⚠ "; }
  .banner.success { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
  .banner.success::before { content: "✓ "; }
  .banner.info { background: var(--info-soft); color: var(--info); border-color: var(--info-line); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s5); margin-bottom: var(--s4); min-width: 0; }
  .card > h2:first-child, .card > h3:first-child { margin-top: 0; }
  .card > :last-child { margin-bottom: 0; }
  @media (max-width: 640px) { .card { padding: var(--s4); } }
  .notice { border-radius: var(--radius-sm); padding: var(--s3) var(--s4); margin-bottom: var(--s3); white-space: pre-line; border: 1px solid transparent; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
  .notice.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
  .notice.info { background: var(--info-soft); color: var(--info); border-color: var(--info-line); }
  .notice > :last-child { margin-bottom: 0; }
  .notice .btn { margin-top: var(--s1); }

  /* ---------------- Shop selection ---------------- */
  .shops { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); margin-top: var(--s4); }
  .shop-card { text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); padding: var(--s5); font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s;
    min-height: 132px; display: flex; flex-direction: column; justify-content: flex-start; }
  .shop-card:hover, .shop-card:focus-visible { border-color: var(--accent); box-shadow: var(--focus); outline: none; }
  .shop-card .name { font-size: 20px; font-weight: 700; margin-bottom: var(--s1); }
  .shop-card.add-shop { border-style: dashed; cursor: default; justify-content: center; }
  .shop-card.add-shop:hover { box-shadow: none; }

  /* ---------------- Sign in ---------------- */
  .login-card { max-width: 460px; margin: 40px auto; text-align: center; }
  .logo-big { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 28px; margin-bottom: var(--s2); }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; }
  .gbtn .g { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #4285f4; font-weight: 700; }

  /* ---------------- Shop tabs (steps 1–3 = sending emails, then the other tools) ---------------- */
  .tabs { display: flex; gap: var(--s1); margin: var(--s4) 0 var(--s2); border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .tab { flex: none; border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 0 var(--s4);
    min-height: 44px; display: inline-flex; align-items: center; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; border-radius: 6px 6px 0 0; }
  .tab:hover { color: var(--ink); background: var(--head); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--line); color: var(--ink); font-size: 13px; margin-right: var(--s2); }
  .tab.active .num { background: var(--accent); color: var(--accent-ink); }
  .tab-sep { flex: none; width: 1px; background: var(--line); margin: 10px var(--s2); }
  .tabs-help { font-size: 13px; color: var(--muted); margin: 0 0 var(--s4); }

  /* ---------------- Buttons (one height per size, everywhere) ---------------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; line-height: 1.2;
    min-height: var(--h-control); padding: 8px 16px; cursor: pointer; text-decoration: none; text-align: center; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.big { font-size: 18px; min-height: var(--h-control-lg); padding: 10px 24px; }
  .btn.small { min-height: var(--h-control-sm); padding: 4px 12px; font-size: 14px; border-radius: var(--radius-sm); }
  .btn.danger { color: var(--bad); border-color: var(--bad-line); background: #fff; }
  .btn.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
  .btn.wa { background: var(--wa); color: #fff; border-color: var(--wa); }
  .btn.wa:hover { filter: brightness(1.08); }
  .btn:disabled, .btn[aria-disabled=true] { opacity: .45; cursor: not-allowed; filter: none; }
  .btn:disabled:hover { border-color: var(--line); }
  .btn.primary:disabled:hover { background: var(--accent); border-color: var(--accent); }
  .link { background: none; border: 0; padding: 2px 0; color: var(--info); font: inherit; cursor: pointer; text-decoration: underline; min-height: 28px; }
  .link.small { font-size: 14px; }
  .danger-link { color: var(--bad); }
  .row { display: flex; gap: var(--s2) var(--s3); flex-wrap: wrap; align-items: center; }
  .row > .btn { flex: none; }
  .spacer { flex: 1; }
  .actions-bar { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--line-soft); }

  /* ---------------- Forms: label always above its input ---------------- */
  label.field, div.field { display: block; margin-bottom: var(--s4); min-width: 0; }
  label.field > span, div.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=search], input[type=email], input[type=password], input[type=url], input[type=number],
  input[type=datetime-local], input[type=date], input[type=time], select, textarea {
    width: 100%; font: inherit; min-height: var(--h-control); padding: 8px 12px;
    border: 1px solid #c3cad5; border-radius: var(--radius-sm); background: #fff; color: var(--ink); max-width: 100%; }
  select { padding-right: 32px; }
  textarea { min-height: 170px; resize: vertical; line-height: 1.5; }
  input::placeholder, textarea::placeholder { color: #7a8494; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
  input:disabled, select:disabled, textarea:disabled { background: var(--head); color: var(--muted); cursor: not-allowed; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: var(--s2) 0; min-height: 28px; cursor: pointer; }
  .check input { margin: 3px 0 0; width: 18px; height: 18px; flex: none; accent-color: var(--accent); cursor: pointer; }
  input[type=radio], input[type=checkbox] { accent-color: var(--accent); }
  .opt { display: flex; gap: var(--s2) var(--s3); align-items: center; flex-wrap: wrap; margin: var(--s2) 0; }
  .req { color: var(--bad); }

  .drop { border: 2px dashed #c3cad5; border-radius: var(--radius); padding: var(--s5); text-align: center; background: #fafbfc; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s4) var(--s5); }
  @media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

  .map-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s3) var(--s4); align-items: center; }
  .map-grid select { min-width: 0; }
  @media (max-width: 560px) { .map-grid { grid-template-columns: minmax(0, 1fr); gap: var(--s1); } .map-grid select { margin-bottom: var(--s3); } }

  /* ---------------- Tables (stack into cards on phones) ---------------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: #fff; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  td { overflow-wrap: break-word; }
  th { background: var(--head); font-weight: 600; position: sticky; top: 0; z-index: 1; white-space: nowrap; color: #2c3546; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td, table tr:hover td { background: #fafbfd; }
  td .row, td.row { gap: 6px; }
  .scroll { max-height: 560px; overflow: auto; }
  @media (max-width: 640px) {
    .table-wrap { border: 0; overflow: visible; }
    .table-wrap.scroll { max-height: none; }
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; background: transparent; }
    .table-wrap tr.th-row, .table-wrap tr:first-child:has(th), .table-wrap thead { display: none; }
    .table-wrap tr { border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; padding: var(--s2) var(--s3); margin-bottom: var(--s2); }
    .table-wrap td { border: 0; padding: 4px 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: var(--s2); align-items: start; }
    .table-wrap td::before { content: attr(data-label); color: var(--muted); font-size: 13px; font-weight: 600; }
    .table-wrap td[data-label=""], .table-wrap td:not([data-label]) { grid-template-columns: minmax(0, 1fr); }
    .table-wrap td[data-label=""]::before, .table-wrap td:not([data-label])::before { display: none; }
    .table-wrap td:empty { display: none; }
    .table-wrap tr:hover td { background: transparent; }
  }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; line-height: 1.5; }
  .b-sent, .b-ok, .b-completed { background: var(--ok-soft); color: var(--ok); }
  .b-pending, .b-running { background: var(--info-soft); color: var(--info); }
  .b-skipped, .b-cancelled, .b-paused, .b-stopped, .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-failed, .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-opened_in_whatsapp { background: var(--ok-soft); color: var(--ok); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin: var(--s3) 0 var(--s4); }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--s3) var(--s4); background: #fff; text-align: left; font: inherit; color: inherit; min-height: 76px; }
  button.stat { cursor: pointer; }
  button.stat:hover { border-color: var(--accent); }
  .stat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .stat .n { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .stat .l { color: var(--muted); font-size: 14px; }

  /* Final check before sending */
  .summary { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px var(--s4); margin: 0 0 var(--s4); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fafbfc; }
  .summary dt { color: var(--muted); font-weight: 600; font-size: 14px; }
  .summary dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .summary { grid-template-columns: minmax(0, 1fr); gap: 0; } .summary dd { margin-bottom: var(--s2); } }

  .email-preview { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: #fff; }
  .email-preview .meta { background: var(--head); padding: 10px 14px; font-size: 14px; }
  .email-preview .meta div { margin: 2px 0; }
  .email-preview .body { padding: 14px; white-space: pre-wrap; }
  .wa-bubble { background: #dcf8c6; border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; max-width: 520px; }

  .chips { display: flex; gap: var(--s2); flex-wrap: wrap; margin: var(--s2) 0 var(--s3); }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; min-height: 32px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .chip:hover { border-color: var(--accent); }

  /* WhatsApp method choice */
  .modes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); margin-bottom: var(--s4); }
  .mode { text-align: left; cursor: pointer; border: 2px solid var(--line); background: var(--card); border-radius: var(--radius);
    padding: var(--s3) var(--s4); font: inherit; color: var(--ink); min-height: 64px; }
  .mode b { display: block; font-size: 16px; margin-bottom: 2px; }
  .mode span { color: var(--muted); font-size: 13px; }
  .mode.active { border-color: var(--accent); background: var(--accent-soft); }
  .mode:hover { border-color: var(--accent); }

  /* Upload history and "Who gets it?" */
  .lists { display: flex; flex-direction: column; gap: var(--s2); }
  .list-row { display: flex; gap: var(--s3); align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--s3) var(--s4); }
  .list-main { flex: 1 1 280px; min-width: 0; }
  .list-actions { gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; }
  .aud { margin-bottom: var(--s4); }
  .aud-lists { margin: 0 0 0 28px; padding: var(--s1) var(--s3); border-left: 3px solid var(--line); }
  .aud-lists .check { margin: var(--s1) 0; }
  .media-pick { margin: var(--s3) 0; padding: var(--s3) var(--s4); border: 1px dashed #c3cad5; border-radius: var(--radius-sm); }
  .media-thumb { max-width: 160px; max-height: 120px; border-radius: 6px; display: block; margin-top: 6px; }

  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin-bottom: var(--s1); }

  /* Loading */
  .busy { position: fixed; inset: 0; background: rgba(20, 25, 35, .35); display: grid; place-items: center; z-index: 50; padding: var(--s4); }
  .busy-box { background: #fff; border-radius: var(--radius); padding: var(--s5) var(--s6); text-align: center; min-width: 240px; max-width: 100%; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .loading-page { text-align: center; padding: 80px 0; color: var(--muted); }

  /* Switch */
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; min-height: 32px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 46px; height: 26px; border-radius: 999px; background: #b9c0cc; position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 23px; }
  .switch input:focus-visible + .track { box-shadow: var(--focus); }

  /* Sending schedule: label column + controls, same on every page */
  .sched { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--s4); background: #fafbfc; }
  .sched > b { display: block; margin-bottom: var(--s1); }
  .sched .opt { margin: var(--s2) 0; }
  .sched .opt > span:first-child { min-width: 150px; font-weight: 500; }
  .sched input[type=number] { width: 96px; }
  .sched input[type=datetime-local] { width: auto; min-width: 210px; }
  .sched select { width: auto; }
  .tz-note { font-size: 13px; color: var(--muted); margin: var(--s1) 0 0; }
  @media (max-width: 560px) { .sched .opt > span:first-child { min-width: 100%; } .sched input[type=datetime-local] { width: 100%; } }

  /* ---------------- Phones ---------------- */
  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; padding: var(--s2) var(--s4); }
    .who { justify-content: flex-start; width: 100%; font-size: 13px; }
    .modes { grid-template-columns: minmax(0, 1fr); }
    main { padding: var(--s4) var(--s3) 48px; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    .btn.big { width: 100%; }
    .list-actions { justify-content: flex-start; }
  }
</style>
