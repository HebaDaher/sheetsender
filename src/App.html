<script>
(function () {
  'use strict';

  /* ---------------- State ---------------- */
  var S = {
    boot: null,          // from getBootstrap()
    shopId: null,
    data: null,          // from getShopData()
    view: 'contacts',
    upload: null,        // {fileName, sheets, sheetName, rows, headerIndex, headers, mapping, consentAll, consentSource}
    importResult: null,
    contactSearch: '', contactFilter: 'all',
    send: { templateId: '', delay: 5, skipPrevious: true, name: '', review: null },
    progress: { campaignId: null, detail: null, filter: 'all' },
    wa: { templateId: '', search: '' },
    tpl: { editing: null },
    refreshTimer: null,
    shopCache: {},       // shopId -> getShopData() result (shown at once, refreshed in the background)
    screen: ''           // 'home' | 'shop' | 'settings' | 'login' | 'welcome'
  };

  var FIELDS = [
    { key: 'full_name', label: 'Name', hint: 'Full name', required: false,
      guess: ['full name', 'name', 'customer', 'client', 'contact', 'الاسم', 'اسم'] },
    { key: 'first_name', label: 'First name', hint: 'Optional — taken from Name if empty', required: false,
      guess: ['first name', 'first', 'firstname', 'given name', 'الاسم الأول'] },
    { key: 'email', label: 'Email', hint: 'Needed for emails', required: false,
      guess: ['email', 'e-mail', 'email address', 'mail', 'البريد', 'الايميل', 'الإيميل'] },
    { key: 'phone', label: 'Phone number', hint: 'Needed for WhatsApp', required: false,
      guess: ['phone', 'mobile', 'whatsapp', 'phone number', 'mobile number', 'tel', 'telephone', 'number', 'الهاتف', 'الجوال', 'رقم', 'موبايل'] },
    { key: 'consent_status', label: 'Consent (agreed to messages?)', hint: 'yes / no', required: false,
      guess: ['consent', 'consent status', 'agreed', 'permission', 'opt in', 'opt-in', 'subscribed', 'الموافقة', 'موافقة'] },
    { key: 'consent_source', label: 'Consent source', hint: 'Where they agreed (optional)', required: false,
      guess: ['consent source', 'source', 'how', 'where', 'المصدر'] },
    { key: 'consent_date', label: 'Consent date', hint: 'Optional', required: false,
      guess: ['consent date', 'date', 'signup date', 'التاريخ'] },
    { key: 'opted_out', label: 'Opted out', hint: 'Optional — yes means never message', required: false,
      guess: ['opted out', 'opt out', 'opt-out', 'unsubscribed', 'unsubscribe', 'stop'] }
  ];
  var PLACEHOLDERS = ['first_name', 'full_name', 'shop_name', 'sender_name', 'email', 'phone'];

  /* ---------------- Helpers ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
  }
  /** This computer's time zone, in words, for every place where a time is chosen. */
  function tzName() {
    var z = ''; try { z = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { z = ''; }
    var off = -new Date().getTimezoneOffset(), sign = off >= 0 ? '+' : '-'; off = Math.abs(off);
    return (z ? z.replace(/_/g, ' ') + ', ' : '') + 'GMT' + sign + Math.floor(off / 60) + (off % 60 ? ':' + pad2(off % 60) : '');
  }

  /* Tables: each cell knows its column name, so on a phone every row shows as a small card ("Email: …"). */
  function labelTables(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('.table-wrap table'), function (t) {
      var head = null, names = [];
      Array.prototype.forEach.call(t.rows, function (tr) {
        if (tr.querySelector('th')) { head = tr; tr.classList.add('th-row'); names = Array.prototype.map.call(tr.cells, function (c) { return c.textContent.trim(); }); return; }
        Array.prototype.forEach.call(tr.cells, function (td, i) { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', names[i] || ''); });
      });
    });
  }
  (function watchTables() {
    var pending = false;
    var mo = new MutationObserver(function () {
      if (pending) return; pending = true;
      (window.requestAnimationFrame || setTimeout)(function () { pending = false; labelTables(document); });
    });
    mo.observe(document.body, { childList: true, subtree: true });
  })();
  function badge(status, text) { return '<span class="badge b-' + esc(status) + '">' + esc(text || status) + '</span>'; }
  function plural(n, word) { return n + ' ' + (n === 1 ? word : (word === 'person' ? 'people' : word + 's')); }

  /* ---------- Sign-in session (kept in this browser; signed by the server) ---------- */
  var SESSION_KEY = 'sf_session';
  var memSession = '';
  function getSession() { try { return localStorage.getItem(SESSION_KEY) || memSession; } catch (e) { return memSession; } }
  function setSession(v) {
    memSession = v || '';
    try { if (v) localStorage.setItem(SESSION_KEY, v); else { localStorage.removeItem(SESSION_KEY); localStorage.removeItem(BOOT_KEY); } } catch (e) { /* kept in memory */ }
    if (!v) S.shopCache = {};
  }

  /* ---------- Speed: show what we already have at once, refresh it quietly in the background ---------- */
  var BOOT_KEY = 'sf_boot';
  function sessionTag() { var s = getSession(); return s ? s.slice(-24) : ''; }
  function savedBoot() {
    try { var v = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); return v && v.s === sessionTag() ? v.b : null; } catch (e) { return null; }
  }
  function saveBoot(b) { try { localStorage.setItem(BOOT_KEY, JSON.stringify({ s: sessionTag(), b: b })); } catch (e) { /* fine */ } }
  function same(a, b) { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } }
  /** Loads every shop's data in the background (one after another), so opening a shop is instant. */
  function prefetchShops() {
    var b = S.boot; if (!b || !b.shops) return;
    var todo = b.shops.map(function (s) { return s.shop_id; }).filter(function (id) { return !S.shopCache[id]; }).slice(0, 6);
    var ws = b.workspace && b.workspace.id;
    (function next() {
      var id = todo.shift(); if (!id) return;
      call('getShopData', id).then(function (d) {
        if (S.boot && S.boot.workspace && S.boot.workspace.id === ws) S.shopCache[id] = d;
        next();
      }, function () { /* opened normally later */ });
    })();
  }
  /** The Excel reader (large) is loaded only when a file is chosen. */
  var xlsxLoading = null;
  function ensureXLSX() {
    if (window.XLSX) return Promise.resolve();
    if (!xlsxLoading) {
      xlsxLoading = call('getSheetJs').then(function (html) {
        var code = String(html).replace(/^[\s\S]*?<script>/, '').replace(/<\/script>[\s\S]*$/, '');
        var el = document.createElement('script'); el.textContent = code; document.head.appendChild(el);
        if (!window.XLSX) throw new Error('The Excel reader could not be loaded. Reload the page and try again.');
      });
      xlsxLoading.catch(function () { xlsxLoading = null; });
    }
    return xlsxLoading;
  }

  function rawCall(fn, args) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); })[fn].apply(null, args);
    });
  }
  /** Every action goes through api(session, name, args); the server checks who is signed in. */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return rawCall('api', [getSession(), fn, args]).catch(function (err) {
      if (/SIGNED_OUT/.test(err && err.message ? err.message : String(err))) { setSession(''); renderLogin(); return new Promise(function () {}); }
      throw err;
    });
  }
  function errText(err) {
    var m = err && err.message ? err.message : String(err);
    if (/Authorization is required|PERMISSION_DENIED|not have permission/i.test(m)) {
      m = 'Google needs your permission again. Reload the page and click "Allow".\n(' + m + ')';
    }
    if (/NetworkError|Failed to fetch|timed out/i.test(m)) m = 'Connection problem. Check your internet and try again.';
    return m;
  }
  var bannerTimer;
  function showBanner(kind, msg, keep) {
    var b = $('banner');
    b.className = 'banner ' + kind;
    b.textContent = msg;
    clearTimeout(bannerTimer);
    if (!keep) bannerTimer = setTimeout(function () { b.className = 'banner hidden'; }, kind === 'error' ? 15000 : 6000);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function hideBanner() { $('banner').className = 'banner hidden'; }
  function busy(text) { $('busyText').textContent = text || 'Working…'; $('busy').classList.remove('hidden'); }
  function done() { $('busy').classList.add('hidden'); }

  function withBusy(text, promise) {
    busy(text);
    // On error: show the message and stop the chain quietly (the following steps never run).
    return promise.then(function (r) { done(); return r; }, function (e) {
      done(); showBanner('error', errText(e)); return new Promise(function () {});
    });
  }

  function renderText(text, fields) {
    return String(text || '').replace(/\{\s*([a-zA-Z_]+)\s*\}/g, function (m, key) {
      var k = key.toLowerCase();
      return Object.prototype.hasOwnProperty.call(fields, k) ? fields[k] : m;
    });
  }
  function fieldsFor(contact, shop) {
    var first = contact.first_name || String(contact.full_name || '').trim().split(/\s+/)[0] || '';
    return {
      first_name: first || 'there',
      full_name: contact.full_name || first || 'there',
      shop_name: shop.shop_name || '',
      sender_name: shop.sender_name || shop.shop_name || '',
      email: contact.email || '',
      phone: contact.phone || ''
    };
  }

  /* ---------------- Boot ---------------- */
  function start() {
    if (window.SF_OAUTH && handleOAuthReturn()) return;
    if (window.SF_FIRST && !getSession()) {
      var first = window.SF_FIRST; window.SF_FIRST = '';
      withBusy('Signing you in…', rawCall('finishFirstLogin', [first])).then(function (r) { setSession(r.session); start(); });
      return;
    }
    if (!getSession()) { renderLogin(); return; }
    var cached = savedBoot();
    if (cached && !cached.needsWorkspace) useBoot(cached); // instant; refreshed just below
    call('getBootstrap').then(function (b) {
      saveBoot(b);
      if (!cached || cached.needsWorkspace) { useBoot(b); prefetchShops(); return; }
      var changed = !same(cached, b);
      S.boot = b;
      if (S.screen === 'home' && changed) useBoot(b); else if (changed) drawWho();
      prefetchShops();
    }, function (err) {
      if (/SIGNED_OUT/.test(errText(err))) return;
      if (cached) { showBanner('error', 'Could not refresh: ' + errText(err)); return; }
      $('app').innerHTML = '<div class="card"><h2>Cannot open the app</h2><p>' + esc(errText(err)) + '</p>' +
        '<p class="muted small">If this keeps happening, send this message to the person who set up the app.</p></div>';
    });
  }

  /* ---------- Sign in with Google (only the email address is shared) ---------- */
  /*
   * Google sends the person back to the app's own link with a one-time code. Before leaving, this page notes in
   * its own storage which sign-in it started; on the way back the code is used only if it matches, so a sign-in
   * started anywhere else is never accepted.
   */
  var PENDING_KEY = 'sf_pending';
  function setPending(p) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(p)); return true; } catch (e) { return false; } }
  function takePending() {
    try { var v = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); localStorage.removeItem(PENDING_KEY); return v; } catch (e) { return null; }
  }
  function stateOf(url) { var m = String(url).match(/[?&]state=([^&]+)/); return m ? decodeURIComponent(m[1]) : ''; }
  function clearUrl() { try { google.script.history.replace(null, {}, ''); } catch (e) { /* not available */ } }
  /** A real link (the click itself opens Google in this tab, which browsers allow). */
  function googleLink(id, url, label, kind, cls) {
    return '<a class="' + (cls || 'btn primary big') + '" id="' + id + '" href="' + esc(url) + '" target="_top" rel="noopener" data-kind="' + kind + '" data-state="' + esc(stateOf(url)) + '">' + label + '</a>';
  }
  function bindGoogleLink(id) {
    var a = $(id); if (!a) return;
    a.addEventListener('click', function (ev) {
      if (!setPending({ kind: a.getAttribute('data-kind'), state: a.getAttribute('data-state'), at: Date.now() })) {
        ev.preventDefault();
        showBanner('error', 'This browser blocks the storage the app needs to sign you in safely (this happens in private/Incognito windows, or when “Block third-party cookies” is on). ' +
          'Open the link in a normal window, or allow cookies for [*.]googleusercontent.com in the browser settings, then try again.', true);
      }
    });
  }

  function renderLogin(message) {
    stopAutoRefresh();
    S.screen = 'login';
    $('who').innerHTML = '';
    $('app').innerHTML = '<div class="card login-card"><div class="logo-big">✉</div><h1>Shop Follow-ups</h1>' +
      '<p class="muted">Follow up with the people interested in your shops — by email and WhatsApp.</p>' +
      (message ? '<div class="notice warn">' + esc(message) + '</div>' : '') +
      '<div id="loginSlot"><button class="btn primary big gbtn" disabled><span class="g">G</span> Sign in with Google</button></div>' +
      '<p class="small muted" style="margin-top:12px">Google asks only to share your email address with the app. Several Google accounts in this browser? Just choose the one you want.</p>' +
      '<p class="small muted" style="margin-top:16px"><a href="https://followups.goskate.ae/start.html" target="_blank" rel="noopener">How it works</a> · ' +
      '<a href="https://followups.goskate.ae/privacy.html" target="_blank" rel="noopener">Privacy</a> · ' +
      '<a href="https://followups.goskate.ae/terms.html" target="_blank" rel="noopener">Terms</a></p></div>';
    rawCall('startLogin', []).then(function (url) {
      if (!$('loginSlot')) return;
      $('loginSlot').innerHTML = googleLink('loginBtn', url, '<span class="g">G</span> Sign in with Google', 'login', 'btn primary big gbtn');
      bindGoogleLink('loginBtn');
    }, function (e) {
      if ($('loginSlot')) $('loginSlot').innerHTML = '<div class="notice bad">' + esc(errText(e)) + '</div>';
    });
  }

  /** Back from Google: finish what THIS browser started. */
  function handleOAuthReturn() {
    var o = null; try { o = JSON.parse(window.SF_OAUTH); } catch (e) { o = null; }
    window.SF_OAUTH = ''; clearUrl();
    var p = takePending();
    if (!o) return false;
    if (!p || p.state !== o.state || Date.now() - Number(p.at || 0) > 15 * 60000) {
      showBanner('error', 'That Google page was not opened from this browser (or it took too long), so it was ignored. Please try again.', true);
      return false;
    }
    if (p.kind === 'login') {
      withBusy('Signing in…', rawCall('finishLogin', [o.code || '', o.state || '', o.error || ''])).then(function (r) {
        setSession(r.session); hideBanner(); start();
      });
      return true;
    }
    if (p.kind === 'gmail') {
      if (!getSession()) { renderLogin('Sign in again, then connect the Gmail account once more.'); return true; }
      S.settings = null;
      withBusy('Finishing the Gmail connection…', call('finishGmailConnect', o.code || '', o.state || '', o.error || '')).then(function (email) {
        return call('getBootstrap').then(function (b) {
          S.boot = b; drawWho(); renderSettings();
          showBanner('success', '✓ Connected: ' + email + '. Now choose it for a shop below and click “Send test”.', true);
        });
      });
      return true;
    }
    return false;
  }

  function signOut() {
    if (!confirm('Sign out of Shop Follow-ups on this browser?')) return;
    setSession(''); S.boot = null; renderLogin();
  }

  function useBoot(boot) {
    if (S.boot && boot.workspace && S.boot.workspace && S.boot.workspace.id !== boot.workspace.id) S.shopCache = {};
    S.boot = boot;
    if (boot.needsWorkspace) { drawWho(); return renderWelcome(); }
    drawWho();
    renderHome();
  }

  /** Top bar: who is signed in, which workspace (switch if more than one), Settings for the workspace owner. */
  function drawWho() {
    var b = S.boot, html = '';
    if (b.workspaces && (b.workspaces.length > 1 || !b.ownsWorkspace)) {
      html += '<select id="wsSel" class="ws-sel" title="Workspace">' + b.workspaces.map(function (w) {
        return '<option value="' + esc(w.id) + '"' + (b.workspace && w.id === b.workspace.id ? ' selected' : '') + '>' + esc(w.name) + (w.mine ? '' : ' (' + esc(w.owner) + ')') + '</option>';
      }).join('') + (!b.ownsWorkspace ? '<option value="__new">+ Create my own workspace</option>' : '') + '</select> ';
    } else if (b.workspace) {
      html += '<span class="ws-name">' + esc(b.workspace.name) + '</span> · ';
    }
    html += '<span class="small">' + esc(b.user) + '</span> <button class="link small" id="signOut">Sign out</button>';
    if (b.isOwner) html += ' <button class="btn small" id="openSettings" style="margin-left:8px">⚙ Settings</button>';
    $('who').innerHTML = html;
    $('signOut').addEventListener('click', signOut);
    if ($('openSettings')) $('openSettings').addEventListener('click', function () { hideBanner(); renderSettings(); });
    if ($('wsSel')) $('wsSel').addEventListener('change', function () {
      var v = this.value;
      if (v === '__new') { renderWelcome(true); return; }
      stopAutoRefresh();
      withBusy('Opening the workspace…', call('switchWorkspace', v)).then(function (b2) { hideBanner(); S.shopCache = {}; saveBoot(b2); useBoot(b2); prefetchShops(); });
    });
  }

  /** First visit (or "Create my own workspace"): one short form. */
  function renderWelcome(extra) {
    stopAutoRefresh();
    S.screen = 'welcome';
    var b = S.boot;
    var html = '<div class="card" style="max-width:640px;margin:0 auto"><h1 style="margin-top:0">Welcome' + (extra ? '' : ' to ' + esc(b.appName || 'Shop Follow-ups')) + '</h1>' +
      '<p>Signed in as <b>' + esc(b.user) + '</b>. Not you? <button class="link" id="wNotYou">Sign out</button></p>' +
      (b.remade ? '<div class="notice warn small">Your earlier workspace was made with the old sign-in, so the app can no longer open it. Create it again here (your old Google Sheet stays in your Drive).</div>' : '') +
      '<p>Create your own private workspace. It keeps your shops, your customers and your sending history in a Google Sheet that is shared with you (you find it in Google Drive under “Shared with me”). Nobody else can see it unless you add them.</p>' +
      '<label class="field"><span>Workspace name</span><input type="text" id="wName" maxlength="60" value="My shops"></label>' +
      '<label class="field"><span>Your first shop’s name</span><input type="text" id="wShop" maxlength="80" placeholder="e.g. Al Barsha Shop"><span class="muted small" style="font-weight:400">You can add more shops later in ⚙ Settings.</span></label>' +
      '<div class="row"><button class="btn primary big" id="wCreate">Create my workspace</button>' + (extra ? '<button class="btn" id="wCancel">Cancel</button>' : '') + '</div>' +
      (extra ? '' : '<div class="notice info small" style="margin-top:16px"><b>Someone already uses this app with you (for example family)?</b> Ask them to add <b>' + esc(b.user) +
        '</b> in their ⚙ Settings → People, then reload this page. You will see their shops here instead.</div>') + '</div>';
    $('app').innerHTML = html;
    $('wCreate').addEventListener('click', function () {
      var shop = $('wShop').value.trim();
      if (!shop) { showBanner('error', 'Write the name of your first shop.'); $('wShop').focus(); return; }
      withBusy('Creating your workspace (a new Google Sheet in your Drive)…', call('createMyWorkspace', $('wName').value, shop))
        .then(function () { return call('getBootstrap'); })
        .then(function (b2) { useBoot(b2); showBanner('success', 'Your workspace is ready. Next: open ⚙ Settings and connect the Gmail account that sends for this shop.', true); });
    });
    if ($('wCancel')) $('wCancel').addEventListener('click', function () { useBoot(S.boot); });
    $('wNotYou').addEventListener('click', signOut);
  }

  function engineNotice() {
    var e = S.boot.engine;
    if (e.healthy) return '';
    var when = e.lastRun ? 'The automatic sender last ran ' + plural(e.minutesAgo, 'minute') + ' ago.' : 'The automatic sender has never run.';
    return '<div class="notice warn"><b>Emails may not be going out.</b> ' + esc(when) +
      (S.boot.isOwner
        ? ' Open ⚙ Settings and click "Restart sender".'
        : ' Ask ' + esc(S.boot.owner) + ' (the owner of this workspace) to open the app, go to ⚙ Settings and click "Restart sender".') + '</div>';
  }

  /* ---------------- Home ---------------- */
  function renderHome() {
    stopAutoRefresh();
    S.screen = 'home';
    S.shopId = null; S.data = null;
    var b = S.boot;
    var html = '<h1>Choose a shop</h1><p class="muted">Pick the shop you want to follow up for.</p>';
    html += engineNotice();
    if (b.isOwner && b.settingsNeeded) {
      html += '<div class="notice info"><b>Finish setup:</b> ' + esc(b.settingsNeeded) + ' <button class="link" id="goSettings">Open Settings</button></div>';
    }
    b.setupProblems.forEach(function (p) { html += '<div class="notice warn">' + esc(p) + '</div>'; });
    if (!b.shops.length && !b.isOwner) {
      html += '<div class="card"><h2>No shops yet</h2><p>Ask ' + esc(b.owner) + ' (the owner of this workspace) to add shops.</p></div>';
    } else {
      html += '<div class="shops">';
      b.shops.forEach(function (s) {
        html += '<button class="shop-card" data-shop="' + esc(s.shop_id) + '">' +
          '<div class="name">' + esc(s.shop_name || s.shop_id) + '</div>' +
          '<div class="muted small">Sends from ' + esc(s.sender_email || 'no Gmail chosen yet') + '</div>' +
          '<div style="margin-top:12px">' + (s.senderOk ? badge('ok', '✓ Ready to send') : badge('bad', '⚠ Sending Gmail not connected')) + '</div>' +
          '</button>';
      });
      if (b.isOwner) html += '<div class="shop-card add-shop" id="addShopCard"><button class="link" id="addShopBtn" style="font-size:17px;font-weight:600">+ Add a shop</button>' +
        '<div class="muted small">Give it a name; choose its Gmail after.</div></div>';
      html += '</div>';
    }
    if (b.isOwner) {
      html += '<p class="muted small" style="margin-top:24px">This is your workspace. Add shops, connect Gmail accounts, WhatsApp and the people who help you in ⚙ Settings. ' +
        'Everything is saved in your <a href="' + esc(b.sheetUrl) + '" target="_blank" rel="noopener">Google Sheet</a>.</p>';
    } else {
      html += '<p class="muted small" style="margin-top:24px">Workspace of ' + esc(b.owner) + '.</p>';
    }
    $('app').innerHTML = html;
    if ($('goSettings')) $('goSettings').addEventListener('click', renderSettings);
    if ($('addShopBtn')) $('addShopBtn').addEventListener('click', addShopInline);
    Array.prototype.forEach.call(document.querySelectorAll('[data-shop]'), function (el) {
      el.addEventListener('click', function () { openShop(el.getAttribute('data-shop')); });
    });
  }

  /** Home page: "+ Add a shop" turns into a small form right there. */
  function addShopInline() {
    var card = $('addShopCard');
    card.innerHTML = '<label class="field" style="margin:0"><span>New shop name</span><input type="text" id="newShopName" maxlength="80" placeholder="e.g. Al Barsha Shop"></label>' +
      '<div class="row" style="margin-top:8px"><button class="btn primary small" id="newShopSave">Add</button><button class="btn small" id="newShopCancel">Cancel</button></div>';
    $('newShopName').focus();
    var save = function () {
      var name = $('newShopName').value.trim();
      if (!name) { showBanner('error', 'Write the shop name.'); $('newShopName').focus(); return; }
      withBusy('Adding the shop…', call('saveShop', { shop_name: name })).then(function (shop) {
        return call('getBootstrap').then(function (b) {
          S.boot = b;
          showBanner('success', 'Added ' + shop.shop_name + '. Next: choose which Gmail sends for it (⚙ Settings → Shops).', true);
          renderHome();
        });
      });
    };
    $('newShopSave').addEventListener('click', save);
    $('newShopName').addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); if (e.key === 'Escape') renderHome(); });
    $('newShopCancel').addEventListener('click', renderHome);
  }

  /** Shop page: "✎ Rename" edits the name right in the title. */
  function renameShopInline() {
    var shop = S.data.shop, box = $('shopTitle');
    box.innerHTML = '<div class="row" style="margin:6px 0 10px"><input type="text" id="shopNewName" maxlength="80" value="' + esc(shop.shop_name) + '" style="max-width:360px;font-size:20px;font-weight:600">' +
      '<button class="btn primary small" id="shopNameSave">Save</button><button class="btn small" id="shopNameCancel">Cancel</button></div>';
    var inp = $('shopNewName'); inp.focus(); inp.select();
    var save = function () {
      var name = inp.value.trim();
      if (!name) { showBanner('error', 'Write the shop name.'); inp.focus(); return; }
      if (name === shop.shop_name) { renderShop(); return; }
      var senderName = !shop.sender_name || shop.sender_name === shop.shop_name ? name : shop.sender_name; // keeps a custom sender name
      withBusy('Saving…', call('saveShop', { shop_id: shop.shop_id, shop_name: name, sender_name: senderName, reply_to: shop.reply_to,
        country_code: shop.country_code, active: true })).then(function () {
        return reloadShop().then(function () {
          S.boot.shops.forEach(function (x) { if (x.shop_id === shop.shop_id) x.shop_name = name; });
          showBanner('success', 'Renamed to ' + name + '. Emails use the new name for {shop_name} from now on.');
          renderShop();
        });
      });
    };
    $('shopNameSave').addEventListener('click', save);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); if (e.key === 'Escape') renderShop(); });
    $('shopNameCancel').addEventListener('click', renderShop);
  }

  function openShop(shopId, view) {
    hideBanner();
    S.shopId = shopId;
    S.view = view || 'contacts';
    S.upload = null; S.importResult = null;
    S.send = { templateId: '', subject: undefined, body: undefined, delay: S.boot.defaultDelay, skipPrevious: true, name: '', review: null };
    S.progress = { campaignId: null, detail: null, filter: 'all' };
    S.wa = { templateId: '', search: '' };
    S.tpl = { editing: null };
    S.aud = { mode: 'all', ids: [] }; S.contactList = ''; S.uploadQueue = []; S.uploadDone = 0;
    S.screen = 'shop';
    var cached = S.shopCache[shopId];
    if (cached) { S.data = cached; renderShop(); } // instant; refreshed just below
    var fresh = call('getShopData', shopId).then(function (data) {
      S.shopCache[shopId] = data;
      if (S.shopId !== shopId) return; // they already went somewhere else
      var changed = !cached || !same(cached, data);
      S.data = data; S.boot.engine = data.engine;
      // Re-draw only where nothing is being typed or uploaded.
      if (!cached || (changed && !S.upload && (S.view === 'contacts' || S.view === 'progress' || S.view === 'templates'))) renderShop();
      else updateEngineBox();
    });
    return cached ? fresh.catch(function (e) { showBanner('error', 'Could not refresh: ' + errText(e)); }) : withBusy('Loading shop…', fresh);
  }

  function reloadShop() {
    var id = S.shopId;
    return call('getShopData', id).then(function (data) {
      S.shopCache[id] = data;
      if (S.shopId !== id) return;
      S.data = data; S.boot.engine = data.engine; updateEngineBox();
    });
  }
  function updateEngineBox() { var el = $('engineBox'); if (el) el.innerHTML = engineNotice(); }

  /* ---------------- Shop shell ---------------- */
  function renderShop() {
    stopAutoRefresh();
    var d = S.data, shop = d.shop;
    var tabs = [
      ['contacts', '1', 'Contacts'], ['send', '2', 'Send emails'], ['progress', '3', 'Progress'],

    html += '<p class="muted">' + (shop.sender_email
      ? 'Emails are sent from the Gmail account <b>' + esc(shop.sender_email) + '</b>' + (shop.sender_name ? ' as “' + esc(shop.sender_name) + '”' : '')

    html += '<div id="engineBox">' + engineNotice() + '</div>';
    html += '<nav class="tabs">';

      if (i === 3) html += '<span class="tab-sep" aria-hidden="true"></span>';
      html += '<button class="tab' + (S.view === t[0] ? ' active' : '') + '" data-view="' + t[0] + '"' + (S.view === t[0] ? ' aria-current="page"' : '') + '>' +
        (t[1] ? '<span class="num">' + t[1] + '</span>' : '') + esc(t[2]) + '</button>';
    });
    html += '</nav><p class="tabs-help">Emails: <b>1 Contacts</b> → <b>2 Send emails</b> → <b>3 Progress</b>. WhatsApp and Message templates can be used at any time.</p><section id="view"></section>';
    $('app').innerHTML = html;
    $('backHome').addEventListener('click', function () {
      hideBanner(); renderHome();

    });
    if ($('shopRename')) $('shopRename').addEventListener('click', renameShopInline);
    if ($('fixSender')) $('fixSender').addEventListener('click', function () { hideBanner(); renderSettings(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (el) {
      el.addEventListener('click', function () { S.view = el.getAttribute('data-view'); hideBanner(); renderShop(); });
    });
    ({ contacts: viewContacts, send: viewSend, progress: viewProgress, whatsapp: viewWhatsApp, templates: viewTemplates })[S.view]();
  }

  /* =================================================================== */
  /* 1. CONTACTS — upload Excel, map columns, import, list, opt-out        */
  /* =================================================================== */
  function viewContacts() {
    var html = '';
    if (!S.upload) {
      html += '<div class="card"><h2>Upload this shop’s Excel files</h2>' +
        '<p class="muted">Each file should have one row per person and a header row (for example: Name, Email, Phone, Consent). ' +
        'You can choose several files at once. Every file is kept in the <b>Upload history</b> below, so you can send it a different message later without uploading it again. ' +
        'A person in several files is saved once.</p>' +
        '<div class="drop" id="drop"><p><b>Drag the Excel files here</b> or</p>' +
        '<label class="btn primary">Choose files<input type="file" id="file" accept=".xlsx,.xls,.csv" multiple class="hidden"></label>' +
        '<p class="muted small" style="margin-top:12px">.xlsx, .xls or .csv — one or more</p></div></div>';
    } else {
      html += mappingHtml();
    }
    if (S.importResult) html += importResultHtml(S.importResult);
    html += listsHtml();
    html += contactsListHtml();
    $('view').innerHTML = html;
    if (!S.upload) bindUpload(); else bindMapping();
    bindLists();
    bindContactsList();
  }

  /* ---------- Upload history: every uploaded file, ready to use again ---------- */
  function listById(id) { return (S.data.lists || []).filter(function (l) { return l.list_id === id; })[0]; }
  function campaignName(id) {
    var k = S.data.campaigns.filter(function (c) { return c.campaign_id === id; })[0];
    return k ? k.campaign_name : '';
  }
  function listsHtml() {
    var lists = S.data.lists || [];
    if (!lists.length) return '';
    var html = '<div class="card" id="historyCard"><h2>Upload history (' + lists.length + ')</h2>' +
      '<p class="muted small">Every file you uploaded. Use one again for a <b>new message</b> — no need to upload it again. ' +
      'The same message is never sent twice to the same person (unless you untick that on the send page).</p><div class="lists">';
    lists.forEach(function (l) {
      var used = (l.campaigns || []).map(campaignName).filter(String);
      html += '<div class="list-row"><div class="list-main"><b>' + esc(l.name) + '</b>' +
        (l.name !== l.file_name ? ' <span class="muted small">(' + esc(l.file_name) + ')</span>' : '') +
        '<div class="muted small">' + plural(l.people, 'person') + ' · ' + l.emailOk + ' can get emails · ' + l.waOk + ' can get WhatsApp · uploaded ' + esc(fmt(l.updated_at)) +
        (l.created_by ? ' by ' + esc(l.created_by) : '') + '</div>' +
        (used.length ? '<details class="small"><summary>Sent to this file ' + used.length + (used.length === 1 ? ' time' : ' times') + '</summary><ul>' +
          used.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>' : '<div class="small muted">Nothing sent to this file yet.</div>') +
        '</div><div class="row list-actions">' +
        '<button class="btn small primary" data-lsend="' + esc(l.list_id) + '">✉ Send email</button>' +
        '<button class="btn small wa" data-lwa="' + esc(l.list_id) + '">WhatsApp</button>' +
        '<button class="btn small" data-lshow="' + esc(l.list_id) + '">Show people</button>' +
        '<button class="link small" data-lren="' + esc(l.list_id) + '">Rename</button>' +
        '<button class="link small danger-link" data-ldel="' + esc(l.list_id) + '">Remove</button></div></div>';
    });
    return html + '</div></div>';
  }
  function bindLists() {
    var each = function (attr, fn) {
      Array.prototype.forEach.call(document.querySelectorAll('[' + attr + ']'), function (b) {
        b.addEventListener('click', function () { fn(b.getAttribute(attr)); });
      });
    };
    each('data-lsend', function (id) { S.aud = { mode: 'pick', ids: [id] }; S.send.review = null; S.view = 'send'; hideBanner(); renderShop(); });
    each('data-lwa', function (id) { S.aud = { mode: 'pick', ids: [id] }; if (S.wa.api) S.wa.api.review = null; S.view = 'whatsapp'; hideBanner(); renderShop(); });
    each('data-lshow', function (id) {
      S.contactList = id; S.contactFilter = 'all'; S.contactSearch = ''; viewContacts();
      var c = $('contactsCard'); if (c) c.scrollIntoView({ behavior: 'smooth' });
    });
    each('data-lren', function (id) {
      var l = listById(id); if (!l) return;
      var name = prompt('New name for this uploaded file:', l.name);
      if (name === null || !name.trim() || name.trim() === l.name) return;
      withBusy('Saving…', call('renameList', S.shopId, id, name)).then(reloadShop).then(function () { showBanner('success', 'Renamed.'); viewContacts(); });
    });
    each('data-ldel', function (id) {
      var l = listById(id); if (!l) return;
      if (!confirm('Remove “' + l.name + '” from the upload history?\n\nThe ' + plural(l.people, 'person') + ' in it stay in your contacts ' +
        '(and in other files they are in). Only this file’s group is removed.')) return;
      withBusy('Removing…', call('removeList', S.shopId, id)).then(reloadShop).then(function () {
        S.aud.ids = S.aud.ids.filter(function (x) { return x !== id; });
        if (S.contactList === id) S.contactList = '';
        showBanner('success', 'Removed from the upload history.'); viewContacts();
      });
    });
  }

  /* ---------- "Who gets it?": everyone, or people from chosen uploaded files ---------- */
  function audienceIds() {
    var a = S.aud || { mode: 'all', ids: [] };
    if (a.mode !== 'pick') return [];
    return a.ids.filter(function (id) { return listById(id); });
  }
  /** Contacts on the current send: the chosen files' people, or everyone. */
  function audienceContacts() {
    var ids = audienceIds();
    if (!ids.length) return S.data.contacts;
    return S.data.contacts.filter(function (c) {
      return String(c.lists || '').split(',').some(function (x) { return ids.indexOf(x) !== -1; });
    });
  }
  function audienceHtml(p) {
    var lists = S.data.lists || [], a = S.aud;
    if (!lists.length) return '';
    var html = '<div class="field aud" id="' + p + 'Aud"><span>Who gets it?</span>' +
      '<label class="check"><input type="radio" name="' + p + 'AudMode" value="all"' + (a.mode !== 'pick' ? ' checked' : '') + '><span>Everyone in this shop (' + plural(S.data.contacts.length, 'person') + ')</span></label>' +
      '<label class="check"><input type="radio" name="' + p + 'AudMode" value="pick"' + (a.mode === 'pick' ? ' checked' : '') + '><span>Only people from these uploaded files:</span></label>' +
      '<div class="aud-lists' + (a.mode === 'pick' ? '' : ' hidden') + '">';
    lists.forEach(function (l) {
      html += '<label class="check"><input type="checkbox" data-aud="' + p + '" value="' + esc(l.list_id) + '"' + (a.ids.indexOf(l.list_id) !== -1 ? ' checked' : '') + '>' +
        '<span>' + esc(l.name) + ' <span class="muted small">— ' + plural(l.people, 'person') + ', uploaded ' + esc(fmt(l.updated_at)) +
        ((l.campaigns || []).length ? ', sent to ' + l.campaigns.length + '×' : '') + '</span></span></label>';
    });
    if (a.mode === 'pick' && !audienceIds().length) html += '<div class="small" style="color:var(--bad)">Tick at least one file.</div>';
    else if (a.mode === 'pick') html += '<div class="small muted">' + plural(audienceContacts().length, 'person') + ' in the chosen files (someone in two files gets it once).</div>';
    return html + '</div></div>';
  }
  function bindAudience(p, onChange) {
    var box = $(p + 'Aud'); if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('input[name="' + p + 'AudMode"]'), function (r) {
      r.addEventListener('change', function () { S.aud.mode = r.value; onChange(); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-aud="' + p + '"]'), function (c) {
      c.addEventListener('change', function () {
        var ids = S.aud.ids.filter(function (x) { return x !== c.value; });
        if (c.checked) ids.push(c.value);
        S.aud.ids = ids; onChange();
      });
    });
  }
  /** Stops a send when "chosen files" is picked but none is ticked. */
  function audienceProblem() { return S.aud.mode === 'pick' && !audienceIds().length ? 'Tick at least one uploaded file under “Who gets it?” (or choose Everyone).' : ''; }

  function bindUpload() {
    var drop = $('drop'), input = $('file');
    input.addEventListener('change', function () { queueFiles(input.files); });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { queueFiles(e.dataTransfer.files); });
  }

  /** Several files: each one is checked (columns) and imported in turn. */
  function queueFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var bad = files.filter(function (f) { return !/\.(xlsx|xls|csv)$/i.test(f.name); });
    if (bad.length) { showBanner('error', 'Please choose Excel files only (.xlsx, .xls or .csv). Not an Excel file: ' + bad.map(function (f) { return f.name; }).join(', ')); return; }
    if (files.length > 20) { showBanner('error', 'Choose at most 20 files at a time.'); return; }
    S.uploadQueue = files.slice(1); S.uploadTotal = files.length; S.uploadDone = 0; S.importResult = null;
    readFile(files[0]);
  }
  function nextQueued() {
    S.uploadDone = (S.uploadDone || 0) + 1;
    if (S.uploadQueue && S.uploadQueue.length) { readFile(S.uploadQueue.shift()); return true; }
    S.uploadTotal = 0;
    return false;
  }

  function readFile(file) {
    hideBanner();
    if (!/\.(xlsx|xls|csv)$/i.test(file.name)) { showBanner('error', 'Please choose an Excel file (.xlsx, .xls or .csv).'); return; }
    if (file.size > 15 * 1024 * 1024) { showBanner('error', 'This file is too big (over 15 MB).'); return; }
    busy('Reading the file…');
    ensureXLSX().then(function () { readFileNow(file); }, function (e) { done(); showBanner('error', errText(e)); });
  }
  function readFileNow(file) {
    var reader = new FileReader();
    reader.onerror = function () { done(); showBanner('error', 'The file could not be read. Try saving it again in Excel.'); };
    reader.onload = function (e) {
      try {
        var wb = window.XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
        var sheets = wb.SheetNames.filter(function (n) { return sheetRows(wb.Sheets[n]).length > 0; });
        if (!sheets.length) throw new Error('The file is empty.');
        S.upload = { fileName: file.name, wb: wb, sheets: sheets, asNew: false };
        chooseSheet(sheets[0]);
        done();
        if (!S.uploadDone) S.importResult = null; // several files: the totals add up until the last one
        viewContacts();
      } catch (err) {
        done();
        var more = S.uploadQueue && S.uploadQueue.length;
        showBanner('error', '“' + file.name + '” could not be opened: ' + (err.message || err) + '\nTry opening it in Excel and saving as .xlsx.' + (more ? '\nThe next file is shown below.' : ''), !!more);
        if (more) nextQueued(); else { S.upload = null; S.uploadTotal = 0; viewContacts(); }
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function cellText(v) {
    if (v === null || v === undefined) return '';
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return '';
      // Excel dates can come back a few seconds before midnight; round to the nearest minute first.
      v = new Date(Math.round(v.getTime() / 60000) * 60000);
      return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
    }
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(v);
    if (typeof v === 'boolean') return v ? 'yes' : 'no';
    return String(v).trim();
  }
  function sheetRows(ws) {
    var rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: false });
    return rows.map(function (r) { return r.map(cellText); })
      .filter(function (r) { return r.some(function (c) { return c !== ''; }); });
  }

  function chooseSheet(name) {
    var u = S.upload;
    var rows = sheetRows(u.wb.Sheets[name]);
    var headerIndex = 0;
    for (var i = 0; i < Math.min(rows.length, 10); i++) {
      if (rows[i].filter(function (c) { return c !== ''; }).length >= 2) { headerIndex = i; break; }
    }
    var headers = rows[headerIndex].map(function (h, i) { return h || ('Column ' + (i + 1)); });
    u.sheetName = name;
    u.rows = rows.slice(headerIndex + 1);
    u.headerIndex = headerIndex;
    u.headers = headers;
    u.mapping = guessMapping(headers);
    u.consentAll = false;
    u.consentSource = '';
  }

  function guessMapping(headers) {
    var lower = headers.map(function (h) { return String(h).trim().toLowerCase(); });
    var used = {};
    var map = {};
    // exact matches first, then "contains"
    [true, false].forEach(function (exact) {
      FIELDS.forEach(function (f) {
        if (map[f.key] !== undefined) return;
        for (var g = 0; g < f.guess.length; g++) {
          for (var i = 0; i < lower.length; i++) {
            if (used[i]) continue;
            var hit = exact ? lower[i] === f.guess[g] : lower[i].indexOf(f.guess[g]) !== -1;
            if (hit) { map[f.key] = i; used[i] = true; return; }
          }
        }
      });
    });
    FIELDS.forEach(function (f) { if (map[f.key] === undefined) map[f.key] = -1; });
    return map;
  }

  function mappedRows() {
    var u = S.upload;
    return u.rows.map(function (r) {
      var o = {};
      FIELDS.forEach(function (f) { var i = u.mapping[f.key]; o[f.key] = i >= 0 ? (r[i] || '') : ''; });
      if (u.mapping.consent_status < 0 && u.consentAll) {
        o.consent_status = 'yes';
        o.consent_source = o.consent_source || u.consentSource;
        if (!o.consent_date) o.consent_date = new Date().toISOString().slice(0, 10);
      }
      return o;
    });
  }

  function mappingProblems() {
    var u = S.upload, m = u.mapping, out = [];
    if (m.full_name < 0 && m.first_name < 0) out.push('Choose which column has the person’s name.');
    if (m.email < 0 && m.phone < 0) out.push('Choose the email column and/or the phone column.');
    var picked = {};
    FIELDS.forEach(function (f) {
      if (m[f.key] >= 0) {
        if (picked[m[f.key]]) out.push('Column “' + u.headers[m[f.key]] + '” is chosen twice.');
        picked[m[f.key]] = true;
      }
    });
    if (m.consent_status < 0 && u.consentAll && !u.consentSource.trim()) out.push('Write where these people agreed to be contacted.');
    return out;
  }

  function mappingHtml() {
    var u = S.upload;
    var many = S.uploadTotal > 1, left = S.uploadQueue ? S.uploadQueue.length : 0;
    var html = '<div class="card"><div class="row"><h2>Check the columns' + (many ? ' — file ' + (S.uploadDone + 1) + ' of ' + S.uploadTotal : '') + '</h2><span class="spacer"></span>' +
      (left ? '<button class="btn small" id="skipUpload">Skip this file</button>' : '') +
      '<button class="btn small" id="cancelUpload">' + (left ? 'Cancel all' : 'Cancel') + '</button></div>' +
      '<p class="muted">File: <b>' + esc(u.fileName) + '</b> — ' + plural(u.rows.length, 'row') + ' found. ' +
      'For each item below, choose the matching column from your file. We guessed them for you — just check.</p>';
    var same = (S.data.lists || []).filter(function (l) { return l.file_name.toLowerCase() === String(u.fileName).trim().toLowerCase(); })[0];
    if (same) {
      html += '<div class="notice info"><b>A file with this name was uploaded before</b> (' + esc(fmt(same.updated_at)) + ', ' + plural(same.people, 'person') + ').' +
        '<label class="check"><input type="radio" name="sameMode" value="replace"' + (u.asNew ? '' : ' checked') + '><span>Update it: “' + esc(same.name) + '” becomes the people in this file</span></label>' +
        '<label class="check"><input type="radio" name="sameMode" value="new"' + (u.asNew ? ' checked' : '') + '><span>Keep both: save this as a new file in the history</span></label></div>';
    }
    if (u.sheets.length > 1) {
      html += '<label class="field"><span>Sheet in the file</span><select id="sheetSel">' +
        u.sheets.map(function (n) { return '<option' + (n === u.sheetName ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
        '</select></label>';
    }
    html += '<div class="map-grid">';
    FIELDS.forEach(function (f) {
      html += '<div><b>' + esc(f.label) + '</b><div class="muted small">' + esc(f.hint) + '</div></div>' +
        '<select data-map="' + f.key + '"><option value="-1">— not in my file —</option>' +
        u.headers.map(function (h, i) {
          return '<option value="' + i + '"' + (u.mapping[f.key] === i ? ' selected' : '') + '>' + esc(h) + '</option>';
        }).join('') + '</select>';
    });
    html += '</div>';

    if (u.mapping.consent_status < 0) {
      html += '<div class="notice warn" style="margin-top:16px"><b>No consent column chosen.</b> People without a clear “yes” are always skipped.' +

  function doImport() {
    if (mappingProblems().length) return;
    var rows = mappedRows();
    var u = S.upload;
    var chunk = 400, prev = S.importResult && S.uploadDone ? S.importResult : null;
    var total = prev || { added: 0, updated: 0, unchanged: 0, rejected: 0, problems: [], files: [] };
    var i = 0, listId = '', token = '', label = S.uploadTotal > 1 ? ' (file ' + (S.uploadDone + 1) + ' of ' + S.uploadTotal + ')' : '';
    busy('Importing…');
    function next() {
      if (i >= rows.length) return Promise.resolve();
      var part = rows.slice(i, i + chunk);
      var firstRowNumber = u.headerIndex + 2 + i;
      $('busyText').textContent = 'Importing' + label + '… ' + Math.min(i + chunk, rows.length) + ' of ' + rows.length;
      var meta = { fileName: u.fileName, firstRowNumber: firstRowNumber };
      if (listId) { meta.listId = listId; meta.uploadToken = token; } else { meta.first = true; meta.asNew = !!u.asNew; }
      meta.part = Math.floor(i / chunk); meta.last = i + chunk >= rows.length;
      return call('importContacts', S.shopId, part, meta).then(function (r) {
        listId = r.listId || listId; token = r.uploadToken || token;
        if (i === 0) total.files.push(r.listName || u.fileName);
        total.added += r.added; total.updated += r.updated; total.unchanged += r.unchanged; total.rejected += r.rejected;
        total.problems = total.problems.concat(r.problems.map(function (p) { return S.uploadTotal > 1 ? u.fileName + ': ' + p : p; })).slice(0, 100);
        i += chunk;
        return next();
      });
    }
    next().then(function () {
      return reloadShop();
    }).then(function () {
      done();
      S.upload = null;
      S.importResult = total;
      if (nextQueued()) { showBanner('success', '“' + u.fileName + '” imported. Now check the next file.'); return; }
      showBanner('success', 'Import finished' + (total.files.length > 1 ? ' (' + total.files.length + ' files)' : '') + ': ' + total.added + ' new, ' + total.updated + ' updated.');
      viewContacts();
    }, function (err) {
      done();
      showBanner('error', 'Import stopped: ' + errText(err) + (i ? '\n' + i + ' rows were saved before the problem.' : ''));
    });
  }

  /* ---------- Sending schedule (shared by email and WhatsApp) ---------- */
  function pad2(n) { return ('0' + n).slice(-2); }
  function localInputValue(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function defaultSchedule(extra) {
    var tomorrow9 = new Date(); tomorrow9.setDate(tomorrow9.getDate() + 1); tomorrow9.setHours(9, 0, 0, 0);
    return Object.assign({ when: 'now', at: localInputValue(tomorrow9), minutes: 5, random: true }, extra || {});
  }
  function scheduleHtml(p, sc, opts) {
    opts = opts || {};
    var hourOpts = function (sel, from, to) { var o = ''; for (var h = from; h <= to; h++) o += '<option value="' + h + '"' + (h === Number(sel) ? ' selected' : '') + '>' + h + ':00</option>'; return o; };
    var html = '<div class="sched"><b>Sending schedule</b>' +
      '<div class="opt"><span style="min-width:120px">Start sending</span>' +
      '<label class="check" style="margin:0"><input type="radio" name="' + p + 'When" value="now"' + (sc.when === 'now' ? ' checked' : '') + '><span>Now</span></label>' +
      '<label class="check" style="margin:0"><input type="radio" name="' + p + 'When" value="at"' + (sc.when === 'at' ? ' checked' : '') + '><span>At</span></label>' +
      '<input type="datetime-local" id="' + p + 'At" aria-label="Start date and time" value="' + esc(sc.at) + '"' + (sc.when === 'at' ? '' : ' disabled') + '></div>' +
      '<p class="tz-note">Date and time are in this computer’s time zone: <b>' + esc(tzName()) + '</b>.</p>' +
      '<div class="opt"><span style="min-width:120px">Wait between ' + (opts.word || 'messages') + '</span>' +
      '<input type="number" id="' + p + 'Min" min="' + (sc.minDelay || 3) + '" max="120" step="1" value="' + esc(sc.minutes) + '"> minutes' +
      '<span class="muted small" id="' + p + 'MinNote"></span></div>' +
      '<div class="opt"><label class="switch"><input type="checkbox" id="' + p + 'Rand"' + (sc.random ? ' checked' : '') + '><span class="track"></span>' +
      '<span>Random extra wait <span class="muted small" id="' + p + 'RandNote"></span></span></label></div>';
    if (opts.limits) {
      html += '<div class="opt"><span style="min-width:120px">At most</span><input type="number" id="' + p + 'Cap" min="1" max="' + (sc.maxCap || 60) + '" value="' + esc(sc.cap) + '"> messages per day</div>' +
        '<div class="opt"><span style="min-width:120px">Only between</span><select id="' + p + 'H1" style="width:auto">' + hourOpts(sc.h1, 0, 23) + '</select> and ' +
        '<select id="' + p + 'H2" style="width:auto">' + hourOpts(sc.h2, 1, 24) + '</select></div>';
    }
    html += '<div id="' + p + 'Hours"></div>';
    if (opts.note) html += '<p class="muted small" style="margin:6px 0 0">' + opts.note + '</p>';
    return html + '</div>';
  }
  /** Warns when "now" (or the chosen start time) is outside the sending hours, and offers "Send now anyway". */
  function hoursWarning(p, sc, hours, onChange) {
    var box = $(p + 'Hours'); if (!box) return;
    var h1 = Number(hours()[0]), h2 = Number(hours()[1]);
    var start = sc.when === 'at' && sc.at ? new Date(sc.at) : new Date();
    var hr = start.getHours(), label = pad2(start.getHours()) + ':' + pad2(start.getMinutes());
    if (sc.ignoreHours) {
      box.innerHTML = '<div class="notice ok small" style="margin:8px 0 0">✓ Sending hours are switched off for this send: it starts ' +
        (sc.when === 'at' ? 'at the chosen time' : 'right away') + ' and keeps going day and night. ' +
        '<button class="link" id="' + p + 'HoursUndo">Undo</button><br><span class="muted">Tip: messages late at night get more “report spam”, which can get the number blocked.</span></div>';
      $(p + 'HoursUndo').onclick = function () { sc.ignoreHours = false; if ($(p + 'H1')) { $(p + 'H1').disabled = false; $(p + 'H2').disabled = false; } hoursWarning(p, sc, hours, onChange); onChange(); };
      return;
    }
    if (hr >= h1 && hr < h2) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="notice warn small" style="margin:8px 0 0"><b>' + (sc.when === 'at' ? 'The start time ' + label : 'It is now ' + label) +
      ', outside the sending hours (' + h1 + ':00–' + h2 + ':00).</b> So the first message would wait until <b>' + h1 + ':00</b>. ' +
      '<div class="row" style="margin-top:8px"><button class="btn small primary" id="' + p + 'HoursIgnore">Send ' + (sc.when === 'at' ? 'at that time' : 'now') + ' anyway</button>' +
      '<span class="muted">(switches off the sending hours for this send only)</span></div></div>';
    $(p + 'HoursIgnore').onclick = function () {
      sc.ignoreHours = true;
      if ($(p + 'H1')) { $(p + 'H1').disabled = true; $(p + 'H2').disabled = true; }
      hoursWarning(p, sc, hours, onChange); onChange();
    };
  }
  function bindSchedule(p, sc, onChange, hours) {
    var hw = function () { if (hours) hoursWarning(p, sc, hours, onChange); };
    function notes() {
      hw();
      var m = Number(sc.minutes) || 0;
      var lo = sc.minDelay || 3;
      $(p + 'MinNote').textContent = m < lo ? 'At least ' + lo + '.' : (lo === 3 && m < 5 ? 'Fast — 5 or more is safer.' : '');
      $(p + 'RandNote').textContent = sc.random ? '(on: each wait is ' + m + '–' + Math.round(m * 1.4) + ' minutes, which looks more natural)' : '(off: exactly ' + m + ' minutes each time)';
    }
    Array.prototype.forEach.call(document.querySelectorAll('input[name="' + p + 'When"]'), function (r) {
      r.addEventListener('change', function () { sc.when = r.value; $(p + 'At').disabled = sc.when !== 'at'; hw(); onChange(); });
    });
    $(p + 'At').addEventListener('change', function () { sc.at = this.value; hw(); onChange(); });
    $(p + 'Min').addEventListener('input', function () { sc.minutes = this.value; notes(); onChange(); });
    $(p + 'Rand').addEventListener('change', function () { sc.random = this.checked; notes(); onChange(); });
    if ($(p + 'Cap')) {
      $(p + 'Cap').addEventListener('input', function () { sc.cap = this.value; onChange(); });
      $(p + 'H1').addEventListener('change', function () { sc.h1 = Number(this.value); hw(); onChange(); });
      $(p + 'H2').addEventListener('change', function () { sc.h2 = Number(this.value); hw(); onChange(); });
      if (sc.ignoreHours) { $(p + 'H1').disabled = true; $(p + 'H2').disabled = true; }
    }
    notes();
    if (sc.when === 'now' && hours) { clearInterval(sc._clock); sc._clock = setInterval(function () { if ($(p + 'Hours')) hw(); else clearInterval(sc._clock); }, 60000); }
  }
  function scheduleProblem(sc, opts) {
    var m = Number(sc.minutes), lo = sc.minDelay || 3, hi = sc.maxCap || 60;
    if (!(m >= lo && m <= 120 && Math.round(m) === m)) return 'Minutes between messages must be a whole number from ' + lo + ' to 120.';
    if (sc.when === 'at') {
      var t = new Date(sc.at).getTime();
      if (!sc.at || isNaN(t)) return 'Choose the date and time to start.';
      if (t < Date.now() - 60000) return 'The start time is in the past. Choose a later time, or choose "Now".';
    }
    if (opts && opts.limits) {
      var c = Number(sc.cap);
      if (!(c >= 1 && c <= hi && Math.round(c) === c)) return 'Messages per day must be a whole number from 1 to ' + hi + '.';
      if (!sc.ignoreHours && !(Number(sc.h2) > Number(sc.h1))) return 'The sending hours must end after they start.';
    }
    return '';
  }
