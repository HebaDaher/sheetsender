      '<div class="row" style="margin-bottom:8px"><button class="btn primary small" id="sInsertName">+ Insert the person\'s name</button></div>' +
      '<div class="muted small">More fields:</div><div class="chips">' +
      ['full_name', 'shop_name', 'sender_name'].map(function (p) { return '<button class="chip" data-sph="' + p + '">{' + p + '}</button>'; }).join('') + '</div>' +
      '</div><div><div class="muted small" style="margin-bottom:4px">Preview — what <b id="sPrevName"></b> will receive</div><div id="sLive"></div>' +
      '<div class="muted small" style="margin:12px 0 4px">How it starts for each person</div><div id="sGreets" class="small"></div>' +
      '<div id="sSpam" style="margin-top:12px"></div></div></div></div>';

    if (!st.sched) st.sched = defaultSchedule();
    html += '<div class="card"><h2>2. Sending options</h2>' + audienceHtml('se') + '<div class="grid2"><div>' +
      scheduleHtml('es', st.sched, { word: 'emails', note: 'Emails also respect the safe-sending limits in Settings (most per day and sending hours).' }) +
      '</div><div>' +
      '<label class="field"><span>Name for this send (optional)</span><input type="text" id="sName" placeholder="Example: November follow-up" value="' + esc(st.name) + '"></label>' +
      '<label class="check"><input type="checkbox" id="sSkip"' + (st.skipPrevious ? ' checked' : '') + '><span>Skip people who already received this exact email from this shop</span></label>' +
      '</div></div><button class="btn primary" id="sReview">3. Check who will get it →</button></div>';
    html += '<div id="reviewBox"></div>';
    $('view').innerHTML = html;

    function live() {
      st.subject = $('sSubject').value; st.body = $('sBody').value; st.review = null;
      if ($('reviewBox')) $('reviewBox').innerHTML = '';
      var c = sendSample(), f = fieldsFor(c, S.data.shop);
      $('sPrevName').textContent = c.full_name || c.first_name || c.email || 'a contact';
      var unknown = (st.subject + ' ' + st.body).match(/\{\s*[a-zA-Z_]+\s*\}/g) || [];
      unknown = unknown.filter(function (m) { return PLACEHOLDERS.indexOf(m.replace(/[{}\s]/g, '').toLowerCase()) === -1; });
      $('sLive').innerHTML = (unknown.length ? '<div class="notice bad">Unknown field: ' + esc(unknown.join(', ')) + '. Use the buttons to insert fields.</div>' : '') +
        '<div class="email-preview"><div class="meta"><div><b>From:</b> ' + esc(S.data.shop.sender_name || S.data.shop.shop_name) + ' &lt;' + esc(S.data.shop.sender_email || 'no Gmail chosen') + '&gt;</div>' +
        '<div><b>Subject:</b> ' + esc(renderText(st.subject, f)) + '</div></div><div class="body">' + esc(renderText(st.body, f)) + '</div></div>';
      var tips = spamCheck(st.subject, st.body);
      $('sSpam').innerHTML = tips.length
        ? '<div class="notice warn"><b>To avoid the spam folder:</b><ul style="margin:6px 0 0;padding-left:18px">' + tips.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>'
        : (st.subject && st.body.trim() ? '<div class="notice ok">✓ Spam check: this email looks like a normal personal message.</div>' : '');
      var people = audienceContacts().filter(function (x) { return x.emailCheck.ok; }).slice(0, 4);
      if (!people.length) people = [c];
      $('sGreets').innerHTML = people.map(function (x) {
        var first = renderText(st.body, fieldsFor(x, S.data.shop)).split(/\r?\n/).filter(function (l) { return l.trim(); })[0] || '';
        return '<div style="padding:4px 0;border-bottom:1px solid var(--line)"><b>' + esc(x.full_name || x.first_name || x.email) + ':</b> ' + esc(first) + '</div>';
      }).join('');
    }
    function insertAt(text) {
      var ta = $('sBody'), s0 = ta.selectionStart, e0 = ta.selectionEnd;
      ta.value = ta.value.slice(0, s0) + text + ta.value.slice(e0);
      ta.focus(); ta.setSelectionRange(s0 + text.length, s0 + text.length);
      live(); if (savedCfg.onNote) savedCfg.onNote();
    }
    var savedCfg = { channel: 'email', list: emailTemplates, getSel: function () { return st.templateId; }, setSel: function (id) { st.templateId = id; },
      getText: function () { return { subject: st.subject || '', body: st.body || '' }; },
      load: function (t) { st.subject = t ? t.subject : ''; st.body = t ? t.body : 'Hello {first_name},\n\n'; st.review = null; },
      rerender: viewSend };
    bindSavedMenu('se', savedCfg);
    $('sSubject').addEventListener('input', function () { live(); savedCfg.onNote(); });
    $('sBody').addEventListener('input', function () { live(); savedCfg.onNote(); });
    $('sInsertName').addEventListener('click', function () { insertAt('{first_name}'); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sph]'), function (b) {
      b.addEventListener('click', function () { insertAt('{' + b.getAttribute('data-sph') + '}'); });
    });
    bindSchedule('es', st.sched, function () { st.review = null; if ($('reviewBox')) $('reviewBox').innerHTML = ''; },
      function () { var R = S.boot.sendingRules || { startHour: 9, endHour: 21 }; return [R.startHour, R.endHour]; });
    $('sSkip').addEventListener('change', function () { st.skipPrevious = this.checked; st.review = null; $('reviewBox').innerHTML = ''; });
    $('sName').addEventListener('input', function () { st.name = this.value; });
    $('sReview').addEventListener('click', loadReview);
    bindAudience('se', function () { st.review = null; viewSend(); });
    live();
    if (st.review) renderReview();
  }

  // Simple checks for things that often send emails to spam.
  var SPAM_WORDS = ['free', 'urgent', 'act now', 'limited time', 'guarantee', 'guaranteed', 'winner', 'congratulations', 'click here',
    'buy now', 'discount', 'cheap', 'best price', 'risk-free', '100%', 'earn money', 'cash', 'offer expires', 'deal of the',
    'مجانا', 'مجاناً', 'عرض خاص', 'خصم', 'اربح', 'فرصة لا تعوض', 'عاجل'];
  function spamCheck(subject, body) {
    var tips = [], all = (subject + ' ' + body), low = all.toLowerCase();
    var hits = SPAM_WORDS.filter(function (w) { return low.indexOf(w) !== -1; });
    if (hits.length) tips.push('Avoid sales words like: ' + hits.slice(0, 5).map(function (w) { return '“' + w + '”'; }).join(', ') + '. Write the way you would to a friend.');
    var letters = subject.replace(/[^A-Za-z]/g, '');
    if (letters.length > 6 && letters === letters.toUpperCase()) tips.push('Don\'t write the subject in CAPITAL LETTERS.');
    if (/[!?]{2,}|!.*!/.test(subject)) tips.push('Use at most one “!” and no “!!” or “?!” in the subject.');
    if (/[$€£]|\bAED\b|درهم/i.test(subject)) tips.push('Leave prices out of the subject line.');
    var links = (all.match(/https?:\/\/|www\./gi) || []).length;
    if (links > 1) tips.push('Use at most one link (you have ' + links + '). Emails full of links look like ads.');
    if (/bit\.ly|tinyurl|goo\.gl|t\.co\//i.test(all)) tips.push('Don\'t use short links (bit.ly etc.); write the full website address.');
    if (body.indexOf('{first_name}') === -1 && body.indexOf('{full_name}') === -1) tips.push('Add the person\'s name (button below the message). Personal emails reach the inbox more often.');
    if (body.replace(/\{[a-z_]+\}/gi, 'x').trim().length < 60) tips.push('The message is very short. Write 2–4 normal sentences.');
    if (subject.trim().length > 70) tips.push('Keep the subject short (under about 60 characters).');
    return tips;
  }

  function sendParams() {
    var st = S.send;
    return { shopId: S.shopId, subject: st.subject, body: st.body, delayMinutes: Number(st.sched.minutes), randomExtra: !!st.sched.random,
      startAt: startAtIso(st.sched), ignoreHours: !!st.sched.ignoreHours, skipPrevious: st.skipPrevious, name: st.name, listIds: audienceIds() };
  }

  function loadReview() {
    var st = S.send;
    var box = $('reviewBox');
    var prob = audienceProblem() || scheduleProblem(st.sched);
    if (prob) { if (box) box.innerHTML = '<div class="notice bad">' + esc(prob) + '</div>'; return; }
    if (box) box.innerHTML = '<div class="card"><div class="spinner"></div><p class="muted" style="text-align:center">Checking contacts…</p></div>';
    call('getCampaignPreview', sendParams())
      .then(function (r) { st.review = r; renderReview(); if ($('reviewBox')) $('reviewBox').scrollIntoView({ behavior: 'smooth' }); }, function (e) {
        if ($('reviewBox')) $('reviewBox').innerHTML = '<div class="notice bad">' + esc(errText(e)) + '</div>';
      });
  }

  function renderReview() {
    var r = S.send.review, box = $('reviewBox');
    if (!box || !r) return;
    var p = r.preview;
    var html = '<div class="card"><h2>3. Review before sending</h2>';
    if (r.audience && r.audience.length) html += '<p class="muted small">Only people from: <b>' + esc(r.audience.join(', ')) + '</b></p>';
    html += '<div class="stats">' +
      '<div class="stat"><div class="n">' + r.willSend + '</div><div class="l">will get the email</div></div>' +
      '<div class="stat"><div class="n">' + r.willSkip + '</div><div class="l">will be skipped</div></div>' +
      '<div class="stat"><div class="n">' + r.delayMinutes + ' min</div><div class="l">between emails</div></div>' +
      '<div class="stat"><div class="n">' + (r.estimatedDays > 1 ? r.estimatedDays + ' days' : (r.estimatedHours < 1 ? Math.max(1, Math.round(r.estimatedHours * 60)) + ' min' : r.estimatedHours + ' h')) + '</div><div class="l">about how long</div></div></div>';
    if (r.skipReasons.length) {
      html += '<details><summary>Why people will be skipped</summary><ul>' + r.skipReasons.map(function (s) {
        return '<li>' + esc(s.reason) + ': <b>' + s.count + '</b></li>';
      }).join('') + '</ul></details>';
    }
    if (r.waitsForHoursLabel) html += '<div class="notice warn" style="margin-top:12px">Because of the sending hours, the first email goes out at <b>' + esc(r.waitsForHoursLabel) + '</b> (UAE time). To send right away, click “Send now anyway” in the Sending schedule.</div>';
    else if (r.startAtLabel) html += '<div class="notice info" style="margin-top:12px">Scheduled: the first email goes out on <b>' + esc(r.startAtLabel) + '</b> (UAE time).</div>';
    else html += '<div class="notice ok" style="margin-top:12px">The first email goes out right away (within about a minute).</div>';
    if (r.rules) html += '<p class="small muted" style="margin-top:8px">Safe sending: at most <b>' + r.rules.dailyCap + '</b> emails per day from this Gmail, ' + (r.ignoreHours ? '<b>day and night</b> (sending hours off for this send)' : 'only between <b>' + r.rules.startHour + ':00</b> and <b>' + r.rules.endHour + ':00</b> (UAE time)') + ', ' +
      (r.randomExtra ? 'about ' + r.delayMinutes + '–' + Math.round(r.delayMinutes * 1.4) : 'exactly ' + r.delayMinutes) + ' minutes apart.</p>';
    if (r.dailyLimitNote) html += '<div class="notice info" style="margin-top:12px">' + esc(r.dailyLimitNote) + '</div>';
    html += '<h3 style="margin-top:16px">What the email looks like' + (r.willSend ? ' (for ' + esc(p.toName || p.to) + ')' : ' (example)') + '</h3>' +
      '<div class="email-preview"><div class="meta">' +
      '<div><b>From:</b> ' + esc(p.fromName) + ' &lt;' + esc(p.from) + '&gt;</div>' +
      '<div><b>To:</b> ' + esc(p.to) + '</div>' +
      (p.replyTo ? '<div><b>Replies go to:</b> ' + esc(p.replyTo) + '</div>' : '') +
      '<div><b>Subject:</b> ' + esc(p.subject) + '</div></div><div class="body">' + esc(p.body) + '</div></div>';
    if (p.samples && p.samples.length > 1) {
      html += '<p class="small muted" style="margin-top:12px">Each person gets their own name:</p><ul class="small">' + p.samples.map(function (x) {
        return '<li><b>' + esc(x.name) + '</b> (' + esc(x.email) + '): ' + esc(x.firstLine) + '</li>';
      }).join('') + '</ul>';
    }
    if (!r.sender.ok) {
      html += '<div class="notice bad" style="margin-top:16px"><b>Cannot send from ' + esc(p.from) + '.</b>\n' + esc(r.sender.reason) + '</div>';
    }
    // Final check: everything that will happen, in one place, right above the button.
    var st = S.send, firstLabel = r.waitsForHoursLabel ? r.waitsForHoursLabel + ' (UAE time)' : r.startAtLabel ? r.startAtLabel + ' (UAE time)' : 'Right away (within about a minute)';
    html += '<h3 style="margin-top:24px">Final check</h3><dl class="summary">' +
      '<dt>Shop</dt><dd>' + esc(S.data.shop.shop_name || S.data.shop.shop_id) + '</dd>' +
      '<dt>Sent by</dt><dd>Gmail · ' + esc(p.fromName) + ' &lt;' + esc(p.from) + '&gt;</dd>' +
      '<dt>Message</dt><dd>' + esc(p.subject) + (st.name ? ' <span class="muted">(send named “' + esc(st.name) + '”)</span>' : '') + '</dd>' +
      '<dt>Who gets it</dt><dd>' + (r.audience && r.audience.length ? 'People from: ' + esc(r.audience.join(', ')) : 'Everyone in this shop') + '</dd>' +
      '<dt>Recipients</dt><dd><b>' + plural(r.willSend, 'person') + '</b>' + (r.willSkip ? ' · ' + r.willSkip + ' skipped (reasons above)' : '') + '</dd>' +
      '<dt>First email</dt><dd>' + esc(firstLabel) + '</dd>' +
      '<dt>Pace</dt><dd>' + (r.randomExtra ? 'About ' + r.delayMinutes + '–' + Math.round(r.delayMinutes * 1.4) : 'Exactly ' + r.delayMinutes) + ' minutes apart' +
        (r.rules ? ', at most ' + r.rules.dailyCap + ' per day' + (r.ignoreHours ? ', day and night' : ', ' + r.rules.startHour + ':00–' + r.rules.endHour + ':00 UAE time') : '') + '</dd>' +
      '<dt>Repeats</dt><dd>' + (st.skipPrevious ? 'People who already got this exact email are skipped' : 'Not checked: people who already got this email will get it again') + '</dd>' +
      '</dl>';
    html += '<div class="row"><button class="btn primary big" id="sStart"' + (!r.sender.ok || !r.willSend ? ' disabled' : '') + '>' +
      (r.startAtLabel ? '⏱ Schedule for ' : '▶ Start sending to ') + plural(r.willSend, 'person') + '</button>' +
      '<span class="muted small">You confirm once more before anything is sent.</span></div>';
    if (!r.willSend && r.sender.ok) html += '<p class="muted small">Nobody can receive this email right now — see the reasons above.</p>';
    html += '</div>';
    box.innerHTML = html;
    var btn = $('sStart');
    if (btn) btn.addEventListener('click', startSending);
  }

  function startSending() {
    var st = S.send, r = st.review;
    if (st.starting) return; // a second click while the first is on its way never starts a second send
    if (!confirm((r.startAtLabel ? 'Schedule' : 'Start sending') + ' this email to ' + plural(r.willSend, 'person') + '?\n\n' +
      (r.startAtLabel ? 'First email: ' + r.startAtLabel + ' (UAE time).\n' : '') + 'One email every ' + plural(r.delayMinutes, 'minute') + (r.randomExtra ? ' or a little more' : '') + '. You can pause at any time in "Progress".')) return;
    st.starting = true;
    if ($('sStart')) $('sStart').disabled = true;
    busy('Starting…');
    call('startCampaign', sendParams()).then(function (camp) {
      done(); st.starting = false;
      return reloadShop().then(function () {
        S.send.review = null; S.send.name = ''; S.send.templateId = camp.template_id;
        S.view = 'progress';
        S.progress = { campaignId: camp.campaign_id, detail: null, filter: 'all' };
        renderShop();
        showBanner('success', camp.status_reason ? camp.status_reason : 'Sending has started. The first email goes out within about a minute.');
      });
    }, function (e) {
      // Nothing was started: the button works again and everything typed stays as it was.
      done(); st.starting = false; if ($('sStart')) $('sStart').disabled = false;
      showBanner('error', errText(e));
    });
  }

  /* =================================================================== */
  /* 3. PROGRESS                                                          */
  /* =================================================================== */
  function viewProgress() {
    if (S.progress.campaignId) return loadCampaign();
    var list = S.data.campaigns;
    var html = '<div class="card"><h2>Sends for this shop</h2>';
    if (!list.length) {
      html += '<p class="muted">Nothing sent yet. Go to <b>2 Send emails</b> to start.</p></div>';
      $('view').innerHTML = html; return;
    }
    html += '<div class="table-wrap"><table><tr><th>Name</th><th>Status</th><th>Sent</th><th>Waiting</th><th>Skipped</th><th>Failed</th><th>Started</th><th></th></tr>';
    list.forEach(function (c) {
      html += '<tr><td>' + esc(c.campaign_name) + (c.channel === 'whatsapp_api' ? ' ' + badge('opened_in_whatsapp', 'WhatsApp') : '') + '</td><td>' + badge(c.status, statusLabel(c.status)) + '</td>' +
        '<td>' + esc(c.sent) + '</td><td>' + esc(c.pending) + '</td><td>' + esc(c.skipped) + '</td><td>' + esc(c.failed) + '</td>' +
        '<td>' + esc(fmt(c.started_at)) + '</td><td><button class="btn small" data-camp="' + esc(c.campaign_id) + '">Open</button></td></tr>';
    });
    html += '</table></div></div>';
    $('view').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-camp]'), function (b) {
      b.addEventListener('click', function () { S.progress = { campaignId: b.getAttribute('data-camp'), detail: null, filter: 'all' }; loadCampaign(); });
    });
    autoRefresh(function () { return reloadShop().then(function () { if (S.view === 'progress' && !S.progress.campaignId) viewProgress(); }); });
  }

  function statusLabel(s) {
    return { running: 'Sending', paused: 'Paused', completed: 'Finished', stopped: 'Stopped', pending: 'Waiting',
      sent: 'Sent', skipped: 'Skipped', failed: 'Failed', cancelled: 'Cancelled', opened_in_whatsapp: 'WhatsApp opened' }[s] || s;
  }

  function loadCampaign(silent) {
    var p = call('getCampaignDetail', S.progress.campaignId);
    if (!silent) {
      $('view').innerHTML = '<div class="card"><div class="spinner"></div></div>';
      p = p.catch(function (e) { showBanner('error', errText(e)); throw e; });
    }
    return p.then(function (d) {
      S.progress.detail = d;
      S.boot.engine = d.engine;
      updateEngineBox();
      if (S.view === 'progress') renderCampaign();
    });
  }

  function renderCampaign() {
    var d = S.progress.detail, c = d.campaign, f = S.progress.filter;
    var html = '<button class="link" id="campBack">← All sends</button>';
    html += '<div class="card"><div class="row"><h2 style="margin:0">' + esc(c.campaign_name) + '</h2>' + badge(c.status, statusLabel(c.status)) + '</div>';
    var isWa = c.channel === 'whatsapp_api';
    var tpl = S.data.templates.filter(function (t) { return t.template_id === c.template_id; })[0];
    var tplName = tpl ? tpl.template_name : (isWa ? String(c.template_id).split(':')[1] || c.template_id : c.template_id);
    html += '<p class="muted small">' + (isWa ? 'WhatsApp Business API template: ' : 'Message: ') + esc(tplName) + ' · From ' + esc(String(c.sender_email).replace(/^whatsapp:/, '')) +
      ' · One ' + (isWa ? 'message' : 'email') + ' every ' + plural(Number(c.delay_minutes), 'minute') + (isWa && c.daily_cap ? ', at most ' + esc(c.daily_cap) + ' per day' : '') +
      ' · Started ' + esc(fmt(c.started_at)) + ' by ' + esc(c.created_by) + '</p>';
    if (isWa) html += '<p class="muted small">“Sent” = WhatsApp accepted the message. Delivered / read: see WhatsApp Manager in Meta.</p>';
    if (c.status_reason) html += '<div class="notice ' + (c.status === 'paused' ? 'warn' : 'info') + '">' + esc(c.status_reason) + '</div>';
    if (c.status === 'running') {
      html += '<p>Next ' + (isWa ? 'message' : 'email') + ': <b>' + (c.next_send_at ? esc(fmt(c.next_send_at)) : 'within a minute') + '</b></p>';
    }
    var n = { all: d.rows.length, sent: 0, pending: 0, skipped: 0, failed: 0 };
    d.rows.forEach(function (r) {
      if (r.status === 'sent') n.sent++; else if (r.status === 'pending') n.pending++;
      else if (r.status === 'failed') n.failed++; else n.skipped++;
    });
    html += '<div class="stats">' + [['sent', 'Sent'], ['pending', 'Waiting'], ['skipped', 'Skipped'], ['failed', 'Failed']].map(function (s) {
      return '<button class="stat' + (f === s[0] ? ' active' : '') + '" data-f="' + s[0] + '"><div class="n">' + n[s[0]] + '</div><div class="l">' + s[1] + '</div></button>';
    }).join('') + '</div>';
    html += '<div class="row">';
    if (c.status === 'running') html += '<button class="btn" id="cPause">⏸ Pause</button>';
    if (c.status === 'paused') html += '<button class="btn primary" id="cResume">▶ Resume</button>';
    if (c.status === 'running' || c.status === 'paused') html += '<button class="btn danger" id="cStop">Stop for good</button>';
    html += '<span class="spacer"></span><button class="btn small" id="cRefresh">↻ Refresh</button></div></div>';

    var rows = d.rows.filter(function (r) {
      if (f === 'all') return true;
      if (f === 'skipped') return r.status === 'skipped' || r.status === 'cancelled';
      return r.status === f;
    });
    html += '<div class="card"><div class="row"><h3 style="margin:0">' + (f === 'all' ? 'Everyone' : statusLabel(f)) + ' (' + rows.length + ')</h3>' +
      (f !== 'all' ? '<button class="link" data-f="all">Show everyone</button>' : '') + '</div>' +
      '<div class="table-wrap scroll" style="margin-top:12px"><table><tr><th>Name</th><th>' + (isWa ? 'Phone' : 'Email') + '</th><th>Status</th><th>Reason / details</th><th>Time</th></tr>' +
      rows.map(function (r) {
        return '<tr><td>' + esc(r.contact_name) + '</td><td>' + esc(isWa ? (r.phone ? '+' + r.phone : '') : r.email) + '</td><td>' + badge(r.status, statusLabel(r.status)) + '</td>' +
          '<td>' + esc(r.status === 'sent' ? '' : r.reason) + '</td><td>' + esc(fmt(r.sent_at)) + '</td></tr>';
      }).join('') + '</table></div></div>';
    $('view').innerHTML = html;

    $('campBack').addEventListener('click', function () { S.progress = { campaignId: null, detail: null, filter: 'all' }; reloadShop().then(viewProgress); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (b) {
      b.addEventListener('click', function () { S.progress.filter = S.progress.filter === b.getAttribute('data-f') ? 'all' : b.getAttribute('data-f'); renderCampaign(); });
    });
    $('cRefresh').addEventListener('click', function () { loadCampaign(); });
    if ($('cPause')) $('cPause').addEventListener('click', function () { campAction('pauseCampaign', 'Paused. Nothing more goes out until you press Resume.'); });
    if ($('cResume')) $('cResume').addEventListener('click', function () { campAction('resumeCampaign', 'Resumed. The next one goes out within about a minute.'); });
    if ($('cStop')) $('cStop').addEventListener('click', function () {
      if (confirm('Stop this send for good?\n\nPeople still waiting will NOT get the message. This cannot be undone (you can start a new send later).')) {
        campAction('stopCampaign', 'Stopped.');
      }
    });
    if (c.status === 'running') autoRefresh(function () { return loadCampaign(true); }); else stopAutoRefresh();
  }

  function campAction(fn, msg) {
    withBusy('Saving…', call(fn, S.progress.campaignId)).then(function () {
      return Promise.all([loadCampaign(true), reloadShop()]);

  /* ---------- Live status of the WhatsApp Sender helper on the Mac ---------- */
  function pollHelper(now) {
    if (S.waTimer) clearTimeout(S.waTimer);
    var run = function () {
      if (!$('waHelper') || S.view !== 'whatsapp') { S.waTimer = null; return; }
      call('getWhatsAppHelper').then(drawHelper, function () {}).then(function () {
        if ($('waHelper') && S.view === 'whatsapp') S.waTimer = setTimeout(run, document.hidden ? 15000 : 5000);
      });
    };
    if (now) run(); else S.waTimer = setTimeout(run, 5000);
  }

  function drawHelper(h) {
    var box = $('waHelper'); if (!box) return;
    var start = $('waStart'), stop = $('waStop'), open = $('waOpen'), link = $('waLink');
    var job = h.job || null, running = job && job.state === 'running';
    var kind = 'info', html = '';
    if (link) {
      link.classList.toggle('hidden', !h.canLink || (h.installed && h.online));
      link.textContent = h.installed ? 'Set up a different Mac' : 'Set up a Mac';
    }
    if (!h.installed) {
      kind = 'warn';
      html = '<b>No Mac is set up for this workspace yet.</b> ' + (h.canLink
        ? 'Click “Set up a Mac” below, on any computer, and follow the 3 steps on the Mac that will send the messages.'
        : h.bridgeReady ? 'Ask ' + esc(h.owner) + ' (the owner of this workspace) to click “Set up a Mac” here on the WhatsApp tab.'
        : 'This needs one update by the app administrator first (they run Install.command once more).');
    } else if (!h.online) {
      kind = 'warn';
      html = '<b>The WhatsApp Sender is not running on the Mac.</b> ' + (h.age_s !== null && h.age_s !== undefined
        ? 'Last seen ' + (h.age_s < 120 ? h.age_s + ' seconds' : Math.round(h.age_s / 60) + ' minutes') + ' ago. Turn on the Mac, log in, and keep it connected to the internet.'
        : 'It has not connected yet. Finish the steps below on the Mac (they take 2–3 minutes), and keep that Mac on.');
    } else if (h.wa === 'connected') {
      kind = 'ok'; html = '<b>✓ WhatsApp connected on the Mac.</b>';
    } else if (h.wa === 'qr') {
      kind = 'warn'; html = '<b>WhatsApp needs to be linked.</b> On the Mac, scan the QR code with the phone: WhatsApp → Settings → Linked devices → Link a device.';
    } else if (h.wa === 'loading') {
      html = '<b>WhatsApp is opening on the Mac…</b>';
    } else {
      html = '<b>The WhatsApp Sender is running.</b> WhatsApp is not open yet — it opens by itself when you start sending, or click “Open WhatsApp on the Mac” to check the connection.';
    }
    var num = function (v) { var n = Number(v); return isFinite(n) && n >= 0 ? Math.round(n) : 0; };
    if (job) {
      job.sent = num(job.sent); job.failed = num(job.failed); job.left = num(job.left); job.total = num(job.total);
      var done = job.sent + job.failed;
      html += '<div style="margin-top:8px"><b>' + esc(job.shop_name || '') + ':</b> ' + job.sent + ' sent' + (job.failed ? ', ' + job.failed + ' not sent' : '') +
        ', ' + job.left + ' left of ' + job.total + (running ? '' : ' — ' + esc({ done: 'finished', stopped: 'stopped' }[job.state] || job.state)) + '.' +
        (job.message ? '<br>' + esc(job.message) : '') +
        (job.last ? '<br><span class="small">Last: ' + esc(job.last.status === 'sent' ? '✓ sent ' : '✗ not sent ') + '(+' + esc(job.last.phone) + ')' + (job.last.reason ? ' — ' + esc(job.last.reason) : '') + '</span>' : '') +
        '<div style="height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden"><div style="height:100%;width:' + (job.total ? Math.round(done * 100 / job.total) : 0) + '%;background:var(--accent)"></div></div></div>';
    }
    if (h.online) html += '<div class="small muted" style="margin-top:8px">Sent today from this Mac: ' + num(h.sent_today) + (h.pending && h.pending.length ? ' · waiting for the Mac to pick up: ' + esc(h.pending.map(function (p) { return p.type; }).join(', ')) : '') + '</div>';
    box.className = 'notice ' + kind;
    box.innerHTML = html;
    start.disabled = !h.online || running || (h.pending || []).some(function (p) { return p.type === 'start'; });
    start.textContent = running ? 'Sending…' : '▶ Start sending';
    stop.classList.toggle('hidden', !running);
    open.classList.toggle('hidden', !h.online || h.wa === 'connected');
  }

      $('macCopy').addEventListener('click', function () { var i = $('macCmd'); i.select(); try { document.execCommand('copy'); } catch (e) {} showBanner('success', 'Copied. Now paste it in the Mac\'s Terminal and press Enter.'); });
      pollHelper(true);
    });
  }

  /* ---------- Photos and videos for WhatsApp ---------- */
  var MEDIA_TYPES = { 'image/jpeg': ['image', 5], 'image/png': ['image', 5], 'video/mp4': ['video', 16], 'video/3gpp': ['video', 16] };
  function mediaById(id) { return id ? (S.data.media || []).filter(function (m) { return m.media_id === id; })[0] : null; }
  function sizeLabel(n) { return n >= 1048576 ? (Math.round(n / 104857.6) / 10) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  /** kind: '' = photo or video; 'image' or 'video' = only that (a Business API template decides). */
  function mediaPickerHtml(p, selected, kind, note) {
    var list = (S.data.media || []).filter(function (m) { return !kind || m.kind === kind; });
    var what = kind === 'video' ? 'video' : kind === 'image' ? 'photo' : 'photo or video';
    var accept = kind === 'video' ? 'video/mp4,video/3gpp' : kind === 'image' ? 'image/jpeg,image/png' : 'image/jpeg,image/png,video/mp4,video/3gpp';
    var html = '<div class="media-pick" id="' + p + 'Media"><b>' + (kind ? 'The ' + what : 'Add a photo or video (optional)') + '</b>' +
      (note ? '<div class="small muted">' + esc(note) + '</div>' : '');
    if (!kind) html += '<label class="check"><input type="radio" name="' + p + 'Med" value=""' + (selected ? '' : ' checked') + '><span>No photo or video — text only</span></label>';
    list.forEach(function (m) {
      html += '<div class="row" style="gap:6px;align-items:center"><label class="check" style="flex:1"><input type="radio" name="' + p + 'Med" value="' + esc(m.media_id) + '"' +
        (selected === m.media_id ? ' checked' : '') + '><span>' + (m.kind === 'video' ? '🎬 ' : '📷 ') + esc(m.name) + ' <span class="muted small">(' + sizeLabel(m.size) + ', added ' + esc(fmt(m.created_at)) + ')</span></span></label>' +
        '<button class="link small danger-link" data-mdel="' + esc(m.media_id) + '">Remove</button></div>';
    });
    if (kind && !list.length) html += '<div class="small muted">No ' + what + ' added yet.</div>';
    html += '<label class="btn small" style="margin-top:8px">+ Add a ' + what + '<input type="file" id="' + p + 'MedFile" accept="' + accept + '" class="hidden"></label>' +
      '<div class="small muted" style="margin-top:4px">' + (kind === 'video' ? 'MP4, up to 16 MB.' : kind === 'image' ? 'JPG or PNG, up to 5 MB.' : 'Photos: JPG or PNG up to 5 MB. Videos: MP4 up to 16 MB (WhatsApp\'s limits).') + '</div></div>';
    return html;
  }
  function bindMediaPicker(p, kind, onPick) {
    var box = $(p + 'Media'); if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('input[name="' + p + 'Med"]'), function (r) {
      r.addEventListener('change', function () { onPick(r.value); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-mdel]'), function (b) {
      b.addEventListener('click', function () {
        var m = mediaById(b.getAttribute('data-mdel')); if (!m) return;
        if (!confirm('Remove “' + m.name + '”?\n\nIt disappears from this list. Messages already sent are not affected.')) return;
        withBusy('Removing…', call('removeMedia', S.shopId, m.media_id)).then(reloadShop).then(function () {
          showBanner('success', 'Removed.'); onPick('');
        });
      });
    });
    $(p + 'MedFile').addEventListener('change', function () {
      var f = this.files[0]; this.value = '';
      if (f) uploadMedia(f, kind).then(function (m) { if (m) onPick(m.media_id); });
    });
  }
  /** Sends the file to the app in 2 MB parts (each goes straight into Google Drive). */
  function uploadMedia(file, kind) {
    hideBanner();
    var type = String(file.type || '').toLowerCase();
    if (!type && /\.jpe?g$/i.test(file.name)) type = 'image/jpeg';
    if (!type && /\.png$/i.test(file.name)) type = 'image/png';
    if (!type && /\.mp4$/i.test(file.name)) type = 'video/mp4';
    var t = MEDIA_TYPES[type];
    if (!t) {
      showBanner('error', /quicktime|\.mov$/i.test(type + file.name) ? 'iPhone videos (.mov) cannot be sent as they are. Save or export the video as MP4 first (for example, send it to yourself on WhatsApp and save it again), then add it here.'
        : /heic|heif/i.test(type + file.name) ? 'iPhone photos (HEIC) cannot be sent as they are. Save the photo as JPG first (on the iPhone: Settings → Camera → Formats → Most Compatible), then add it here.'
        : 'This kind of file cannot be sent. Use a photo (JPG or PNG) or a video (MP4).');
      return Promise.resolve(null);
    }
    if (kind && t[0] !== kind) { showBanner('error', 'This template needs a ' + (kind === 'video' ? 'video' : 'photo') + '.'); return Promise.resolve(null); }
    if (file.size > t[1] * 1048576) { showBanner('error', 'This ' + (t[0] === 'video' ? 'video' : 'photo') + ' is bigger than ' + t[1] + ' MB (WhatsApp\'s limit). Make it smaller and try again.'); return Promise.resolve(null); }
    busy('Adding the ' + (t[0] === 'video' ? 'video' : 'photo') + '…');
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onerror = function () { done(); showBanner('error', 'The file could not be read.'); resolve(null); };
      reader.onload = function () {
        var bytes = new Uint8Array(reader.result);
        call('startMediaUpload', S.shopId, { name: file.name, mime: type, size: bytes.length }).then(function (s) {
          var off = 0;
          function next() {
            var part = bytes.subarray(off, Math.min(bytes.length, off + s.chunk));
            var bin = '';
            for (var i = 0; i < part.length; i += 32768) bin += String.fromCharCode.apply(null, part.subarray(i, i + 32768));
            $('busyText').textContent = 'Adding the ' + (t[0] === 'video' ? 'video' : 'photo') + '… ' + Math.round(off * 100 / bytes.length) + '%';
            return call('uploadMediaChunk', s.uploadId, off, btoa(bin)).then(function (r) {
              off += part.length;
              return r.done ? r.media : next();
            });
          }
          return next();
        }).then(function (m) {
          return reloadShop().then(function () { done(); showBanner('success', 'Added “' + m.name + '”.'); resolve(m); });
        }).catch(function (e) { done(); showBanner('error', 'The file was not added: ' + errText(e)); resolve(null); });
      };
      reader.readAsArrayBuffer(file);
    });
  }

  /* ---------- WhatsApp Business API sending (paid; laptops can be off) ---------- */
  var FIELD_LABELS = { first_name: 'First name', full_name: 'Full name', shop_name: 'Shop name', sender_name: 'Sender name', phone: 'Phone', email: 'Email' };

  function apiState() {
    return S.wa.api || (S.wa.api = { templates: null, key: '', mapping: {}, headerMapping: {}, skipPrevious: true, name: '', review: null,
      sched: defaultSchedule({ minutes: 2, cap: 250, h1: 9, h2: 21, minDelay: 1, maxCap: 1000 }) });
  }

  function apiWhatsAppHtml() {
    var api = S.data.waApi || { configured: false };

      var who = S.boot.isOwner ? 'Connect it once in <b>⚙ Settings → WhatsApp Business API</b> (the steps are there).' :

      return '<div class="card"><h2>WhatsApp Business API</h2>' +
        (api.configured ? '<div class="notice warn"><b>The connection needs attention.</b> ' + esc(api.last_error || api.status) + '</div>' :

      '</b> through Meta. Works even when every laptop is off. Meta charges your business for each message.</p><div id="apiBody"><div class="spinner"></div></div></div>';
  }

  function bindApiWhatsApp() {
    if ($('apiGoSettings')) $('apiGoSettings').addEventListener('click', function () { hideBanner(); renderSettings(); });
    if (!$('apiBody')) return;
    var a = apiState();
    if (a.templates) return drawApiBody();
    call('getWhatsAppApiTemplates').then(function (r) { a.templates = r.templates; if ($('apiBody')) drawApiBody(); },
      function (e) { if ($('apiBody')) $('apiBody').innerHTML = '<div class="notice bad">' + esc(errText(e)) + '</div>'; });
  }

  function apiTemplate() {
    var a = apiState();
    return (a.templates || []).filter(function (t) { return t.name + '|' + t.language === a.key; })[0];
  }

  function defaultParam(k, named) {
    if (!named) return { 1: 'first_name', 2: 'shop_name' }[k] || '';
    if (FIELD_LABELS[k]) return k;
    if (/^(name|customer|first)/i.test(k)) return 'first_name';
    if (/shop|store|business/i.test(k)) return 'shop_name';
    return '';
  }

  function paramRow(group, k, value) {
    var isText = String(value || '').indexOf('text:') === 0;
    return '<div class="opt"><span style="min-width:90px"><code>{{' + esc(k) + '}}</code></span>' +
      '<select data-pgroup="' + group + '" data-pkey="' + esc(k) + '" style="width:auto"><option value="">— choose —</option>' +
      Object.keys(FIELD_LABELS).map(function (f) { return '<option value="' + f + '"' + (value === f ? ' selected' : '') + '>' + FIELD_LABELS[f] + '</option>'; }).join('') +
      '<option value="text:"' + (isText ? ' selected' : '') + '>Fixed text…</option></select>' +
      '<input type="text" data-ptext="' + group + '|' + esc(k) + '" maxlength="200" placeholder="the text" value="' + esc(isText ? value.slice(5) : '') + '"' + (isText ? '' : ' class="hidden"') + ' style="max-width:260px"></div>';
  }

  function drawApiBody() {
    var a = apiState(), list = a.templates || [];
    var usable = list.filter(function (t) { return t.status === 'APPROVED' && t.ok; });
    var box = $('apiBody');
    if (!usable.length) {
      box.innerHTML = '<div class="notice warn">No approved message templates yet. Create one in Meta’s WhatsApp Manager (Message templates → Create), wait until it is approved, then ' +
        (S.boot.isOwner ? 'click “Reload templates” in ⚙ Settings.' : 'ask ' + esc(S.boot.owner) + ' to click “Reload templates” in ⚙ Settings.') + '</div>';
      return;
    }
    if (!apiTemplate()) { a.key = usable[0].name + '|' + usable[0].language; a.mapping = {}; a.headerMapping = {}; a.review = null; }
    var t = apiTemplate();
    t.params.forEach(function (k) { if (a.mapping[k] === undefined) a.mapping[k] = defaultParam(k, t.named); });
    t.header_params.forEach(function (k) { if (a.headerMapping[k] === undefined) a.headerMapping[k] = defaultParam(k, t.named); });
    var html = '<label class="field"><span>Message template (approved by Meta)</span><select id="apiTpl">' + usable.map(function (x) {
      var k = x.name + '|' + x.language;
      return '<option value="' + esc(k) + '"' + (k === a.key ? ' selected' : '') + '>' + esc(x.name) + ' (' + esc(x.language) + ', ' + esc(String(x.category).toLowerCase()) + ')</option>';
    }).join('') + '</select></label>';
    html += '<div class="grid2"><div>';
    if (t.params.length || t.header_params.length) {
      html += '<div class="field"><span style="display:block;font-weight:600;margin-bottom:4px">What goes in each blank</span>' +
        t.header_params.map(function (k) { return paramRow('h', k, a.headerMapping[k]); }).join('') +
        t.params.map(function (k) { return paramRow('b', k, a.mapping[k]); }).join('') + '</div>';
    } else {
      html += '<p class="muted small">This template has no blanks: everyone gets the same text.</p>';
    }
    if (t.header_media) {
      if (a.mediaId && (!mediaById(a.mediaId) || mediaById(a.mediaId).kind !== t.header_media)) a.mediaId = '';
      html += mediaPickerHtml('am', a.mediaId, t.header_media, 'This template starts with a ' + (t.header_media === 'video' ? 'video' : 'photo') + ' — choose which one (required).');
    }
    html += '<label class="check"><input type="checkbox" id="apiSkip"' + (a.skipPrevious ? ' checked' : '') + '><span>Skip people who already received this template</span></label>' +
      '<label class="field"><span>Name for this send (optional)</span><input type="text" id="apiName" maxlength="100" value="' + esc(a.name) + '"></label></div>' +
      '<div><div class="muted small" style="margin-bottom:4px">What the first people receive</div><div id="apiGreets" class="small"></div></div></div>';
    html += '<div style="margin-top:12px">' + scheduleHtml('as', a.sched, { limits: true, note: 'UAE time. Meta allows a new business about 250 people per day at first.' }) + '</div>' +
      '<div id="apiReview"></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="apiCheck">Check who will receive it</button><button class="btn primary big" id="apiStart">▶ Start sending</button></div>';
    box.innerHTML = html;

    function render(text, map, c) { return renderTplText(text, map, fieldsFor(c, S.data.shop)); }
    function live() {
      var people = audienceContacts().filter(function (x) { return x.waCheck.ok; }).slice(0, 3);
      $('apiGreets').innerHTML = people.length ? people.map(function (c) {
        var hm = t.header_media ? mediaById(a.mediaId) : null;
        return '<div class="wa-bubble" style="margin-bottom:8px">' + (t.header_media ? '<div class="small"><b>' + (hm ? (hm.kind === 'video' ? '🎬 ' : '📷 ') + esc(hm.name) : '(' + (t.header_media === 'video' ? 'video' : 'photo') + ' not chosen yet)') + '</b></div>' : '') + (t.header ? '<b>' + esc(render(t.header, a.headerMapping, c)) + '</b><br>' : '') + esc(render(t.body, a.mapping, c)) +
          '<div class="muted small" style="margin-top:4px">→ ' + esc(c.full_name || c.first_name || c.phone) + '</div></div>';
      }).join('') : '<span class="muted">Nobody in this shop can be messaged yet (people need a phone number and consent).</span>';
    }
    var reset = function () { a.review = null; if ($('apiReview')) $('apiReview').innerHTML = ''; };
    $('apiTpl').addEventListener('change', function () { a.key = this.value; a.mapping = {}; a.headerMapping = {}; reset(); drawApiBody(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pgroup]'), function (sel) {
      sel.addEventListener('change', function () {
        var g = sel.getAttribute('data-pgroup'), k = sel.getAttribute('data-pkey'), m = g === 'h' ? a.headerMapping : a.mapping;
        var txt = document.querySelector('[data-ptext="' + g + '|' + k + '"]');
        if (sel.value === 'text:') { txt.classList.remove('hidden'); m[k] = 'text:' + txt.value; txt.focus(); } else { txt.classList.add('hidden'); m[k] = sel.value; }
        reset(); live();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ptext]'), function (inp) {
      inp.addEventListener('input', function () {
        var parts = inp.getAttribute('data-ptext').split('|'), m = parts[0] === 'h' ? a.headerMapping : a.mapping;
        m[parts[1]] = 'text:' + inp.value; reset(); live();
      });
    });
    $('apiSkip').addEventListener('change', function () { a.skipPrevious = this.checked; reset(); });
    if (t.header_media) bindMediaPicker('am', t.header_media, function (id) { a.mediaId = id; reset(); drawApiBody(); });
    $('apiName').addEventListener('input', function () { a.name = this.value; });
    bindSchedule('as', a.sched, reset, function () { return [a.sched.h1, a.sched.h2]; });
    $('apiCheck').addEventListener('click', function () { apiPreview().catch(function () {}); });
    $('apiStart').addEventListener('click', apiStart);
    live();
  }

  /** Same as the server: fills {{n}} / {{name}} with the chosen field or fixed text (no line breaks inside a value). */
  function renderTplText(text, map, fields) {
    return String(text || '').replace(/\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g, function (m, k) {
      var spec = map[k]; if (!spec) return m;
      var v = String(spec).indexOf('text:') === 0 ? String(spec).slice(5) : String(fields[spec] || '');
      return v.replace(/[\r\n\t]+/g, ' ').replace(/ {2,}/g, ' ').trim() || '-';
    });
  }

  function apiParams() {
    var a = apiState(), t = apiTemplate(), sc = a.sched;
    return { shopId: S.shopId, template: t.name, language: t.language, mapping: a.mapping, headerMapping: a.headerMapping, skipPrevious: a.skipPrevious,
      mediaId: t.header_media ? (a.mediaId || '') : '',
      name: a.name, delayMinutes: Number(sc.minutes), randomExtra: !!sc.random, dailyCap: Number(sc.cap), startHour: Number(sc.h1), endHour: Number(sc.h2),
      startAt: startAtIso(sc), ignoreHours: !!sc.ignoreHours, listIds: audienceIds() };

      '<p class="muted small" style="margin-top:12px">Tip: end emails with a line such as “Reply STOP if you prefer no more emails.” and mark those people as opted out.</p></div></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn primary" id="tSave">Save template</button><button class="btn" id="tCancel">Cancel</button></div></div>';
    $('view').innerHTML = html;
    function sync() {
      t.template_name = $('tName').value; t.channel = $('tChannel').value; t.subject = $('tSubject').value;
      t.body = $('tBody').value; t.active = $('tActive').checked ? 'yes' : 'no';
      $('tSubjWrap').classList.toggle('hidden', t.channel !== 'email');
      var sample = S.data.contacts.filter(function (c) { return c.emailCheck.ok || c.waCheck.ok; })[0] ||
        { first_name: 'Ahmed', full_name: 'Ahmed Ali', email: 'ahmed@example.com', phone: '971501234567' };
      var f = fieldsFor(sample, S.data.shop);
      var unknown = (String(t.subject) + ' ' + String(t.body)).match(/\{\s*[a-zA-Z_]+\s*\}/g) || [];
      unknown = unknown.filter(function (m) { return PLACEHOLDERS.indexOf(m.replace(/[{}\s]/g, '').toLowerCase()) === -1; });
      $('tPreview').innerHTML = (unknown.length ? '<div class="notice bad">Unknown field: ' + esc(unknown.join(', ')) + '</div>' : '') +
        (t.channel === 'email'
          ? '<div class="email-preview"><div class="meta"><div><b>Subject:</b> ' + esc(renderText(t.subject, f)) + '</div></div><div class="body">' + esc(renderText(t.body, f)) + '</div></div>'
          : '<div class="wa-bubble">' + esc(renderText(t.body, f)) + '</div>');
    }
    ['tName', 'tSubject', 'tBody'].forEach(function (id) { $(id).addEventListener('input', sync); });
    ['tChannel', 'tActive'].forEach(function (id) { $(id).addEventListener('change', sync); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ph]'), function (b) {
      b.addEventListener('click', function () {
        var ta = $('tBody'), ph = '{' + b.getAttribute('data-ph') + '}';
        var s = ta.selectionStart, e = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + ph + ta.value.slice(e);
        ta.focus(); ta.setSelectionRange(s + ph.length, s + ph.length);
        sync();
      });
    });
    $('tCancel').addEventListener('click', function () { S.tpl.editing = null; viewTemplates(); });
    $('tSave').addEventListener('click', function () {
      sync();
      withBusy('Saving…', call('saveTemplate', t)).then(function () {
        return reloadShop();
      }).then(function () {
        S.tpl.editing = null; S.send.review = null;
        showBanner('success', 'Template saved.');
        viewTemplates();
      });
    });
    sync();
  }

  function renderSettings() {
    stopAutoRefresh();
    S.shopId = null;
    var coming = S.screen !== 'settings'; // coming from another screen (not re-drawing after a change made here)
    S.screen = 'settings';
    var wsId = S.boot && S.boot.workspace ? S.boot.workspace.id : '';
    var cached = coming && S.settings && S.settings.workspace && S.settings.workspace.id === wsId ? S.settings : null;
    if (cached) drawSettings(); // instant; refreshed just below
    else $('app').innerHTML = '<div class="card"><div class="spinner"></div><p class="muted" style="text-align:center">Loading settings…</p></div>';
    call('getSettings').then(function (st) {
      var changed = !cached || !same(cached, st);
      S.settings = st; S.boot.engine = st.engine;
      if (S.screen !== 'settings') return;
      var typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (changed && !typing) drawSettings();
    }, function (e) {
      if (!cached && S.screen === 'settings') $('app').innerHTML = '<div class="notice bad">' + esc(errText(e)) + '</div>';
    });
  }

  function bindSettings(st) {
    var on = function (id, fn) { if ($(id)) $(id).addEventListener('click', fn); };
    var each = function (attr, fn) { Array.prototype.forEach.call(document.querySelectorAll('[' + attr + ']'), function (b) { b.addEventListener('click', function () { fn(b.getAttribute(attr), b); }); }); };
    on('saveRules', function () {
      withBusy('Saving…', call('saveSendingRules', { dailyCap: $('ruleCap').value, startHour: $('ruleStart').value, endHour: $('ruleEnd').value }))
        .then(function (r) { S.boot.sendingRules = r; showBanner('success', 'Saved. At most ' + r.dailyCap + ' emails per Gmail per day, between ' + r.startHour + ':00 and ' + r.endHour + ':00.'); renderSettings(); });
    });
    on('setBack', function () { hideBanner(); call('getBootstrap').then(useBoot); });
    on('wsRename', function () {
      var n = prompt('New name for this workspace:', st.workspace.name);
      if (!n || !n.trim()) return;
      withBusy('Saving…', call('renameWorkspace', n)).then(function () { return call('getBootstrap'); }).then(function (b) { S.boot = b; drawWho(); renderSettings(); });
    });
    var copy = function (id) { var i = $(id); i.select(); try { document.execCommand('copy'); } catch (e) {} showBanner('success', 'Copied.'); };
    on('copyApp', function () { copy('appUrl'); });
    on('copyRedir', function () { copy('redir'); });
    on('saveSite', function () {
      var d = $('siteName').value.trim(); if (!d) return;
      if (!confirm('Did you already add https://' + d.replace(/^https?:\/\//, '').replace(/\/.*$/, '') + '/oauth/ to the Authorized redirect URIs in Google Cloud?\n\nIf not, click Cancel and add it first — otherwise signing in stops working.')) return;
      withBusy('Checking the website…', call('saveWebsite', d)).then(function (r) { showBanner('success', 'Done. Google now sends people back through ' + r.redirectUri); renderSettings(); });
    });
    on('stopSite', function () {
      if (!confirm('Stop using your website for signing in? Google then sends people back to the app link again.')) return;
      withBusy('Saving…', call('saveWebsite', '')).then(function () { showBanner('success', 'Switched back to the app link.'); renderSettings(); });
    });
    on('saveClient', function () {
      withBusy('Saving…', call('saveOAuthClient', $('cid').value, $('csec').value)).then(function () {
        showBanner('success', 'Google sign-in saved. Now click “Connect a Gmail account”.'); renderSettings();
      });
    });
    on('refreshSet', renderSettings);
    on('connectNew', function () { connectAccount(''); });
    each('data-recon', function (em) { connectAccount(em); });
    each('data-test', function (em) {
      withBusy('Sending a test email…', call('testGmailAccount', em)).then(function (r) { showBanner('success', r.message); renderSettings(); });
    });
    each('data-disc', function (em) {
      if (!confirm('Disconnect ' + em + '?\n\nThe app will stop sending from it and any running send using it will pause. You can reconnect later.')) return;
      withBusy('Disconnecting…', call('disconnectGmailAccount', em)).then(function (r) {
        showBanner('success', 'Disconnected ' + em + (r.paused ? '. ' + plural(r.paused, 'running send') + ' paused.' : '.')); renderSettings();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-shopsender]'), function (sel) {
      sel.addEventListener('change', function () {
        withBusy('Saving…', call('assignShopSender', sel.getAttribute('data-shopsender'), sel.value)).then(function () { showBanner('success', 'Saved.'); renderSettings(); });
      });
    });
    on('shopAdd', function () { shopForm(null); });
    each('data-shopedit', function (id) { shopForm(st.shops.filter(function (s) { return s.shop_id === id; })[0]); });
    each('data-shophide', function (id) {
      var s = st.shops.filter(function (x) { return x.shop_id === id; })[0];
      withBusy('Saving…', call('saveShop', { shop_id: s.shop_id, shop_name: s.shop_name, sender_name: s.sender_name, reply_to: s.reply_to, country_code: s.country_code, active: !s.active }))
        .then(function () { showBanner('success', s.active ? 'Hidden. Its people and history are kept.' : 'Shown again.'); renderSettings(); });
    });
    on('mAdd', function () {
      var em = $('mEmail').value.trim();
      if (!em) { showBanner('error', 'Write their Gmail address.'); return; }
      withBusy('Adding…', call('addMember', em)).then(function () {
        showBanner('success', 'Added ' + em + '. Send them the app link: they open it with that Google account and see this workspace.', true); renderSettings();
      });
    });
    each('data-mremove', function (em) {
      if (!confirm('Remove ' + em + '? They will no longer be able to open this workspace.')) return;
      withBusy('Removing…', call('removeMember', em)).then(function () { showBanner('success', 'Removed ' + em + '.'); renderSettings(); });
    });
    bindWaApiSettings(st.waApi);
    on('restartEngine', function () {
      withBusy('Restarting…', call('restartEngine')).then(function (e) { S.boot.engine = e; showBanner('success', 'The automatic sender is running.'); renderSettings(); });
    });
  }

  /* ---------- WhatsApp Business API: connection (Settings, owner) ---------- */

    var stateBadge = !api.configured ? badge('skipped', 'Not connected') : api.status === 'connected' ? badge('ok', '✓ Connected') :
      api.status === 'needs_reconnect' ? badge('bad', 'Needs a new token') : badge('skipped', 'Disconnected');
    var html = '<div class="card"><div class="row"><h2 style="margin:0">WhatsApp Business API (optional, paid)</h2>' + stateBadge + '</div>' +
      '<p class="muted" style="margin-top:8px">Sends WhatsApp messages from Meta’s servers, so it works even when every laptop is off. ' +
      'Meta charges your business for each message (marketing messages cost more than service/utility ones; see Meta’s price list). ' +
      'Messages must use templates that Meta approved first. Without it, you can still send for free from a Mac (WhatsApp tab).</p>';
    if (api.configured && api.status === 'connected') {
      html += '<p><b>' + esc(api.verified_name || '') + '</b> ' + esc(api.display_phone || '') + (api.quality ? ' · quality: ' + esc(api.quality) : '') +
        ' · templates loaded ' + esc(fmt(api.templates_at)) + '</p>';
    } else if (api.configured && api.last_error) {
      html += '<div class="notice warn small">' + esc(api.last_error) + '</div>';
    }
    html += '<div class="grid2"><label class="field"><span>Phone number ID</span><input type="text" id="waPnid" inputmode="numeric" value="' + esc(api.phone_number_id || '') + '"></label>' +
      '<label class="field"><span>WhatsApp Business Account ID</span><input type="text" id="waWaba" inputmode="numeric" value="' + esc(api.waba_id || '') + '"></label></div>' +
      '<label class="field"><span>Access token (permanent, from a Meta system user)</span><input type="password" id="waTok" autocomplete="off" placeholder="' +
      (api.tokenSaved ? 'Saved — paste a new one only to replace it' : 'Paste the access token') + '"></label>' +
      '<div class="row"><button class="btn primary" id="waSave">Save and test</button>' +
      (api.configured && api.status === 'connected' ? '<button class="btn" id="waReload">↻ Reload templates</button><button class="btn danger" id="waDisc">Disconnect</button>' : '') + '</div>' +
      '<p class="muted small" style="margin-top:8px">The token is kept privately on the server for your account only. It is never shown again or written to the Sheet.</p>' +
      '<div id="waTplList"></div>' +
      '<details style="margin-top:12px"><summary><b>How to get these (one time, about 20 minutes)</b></summary><ol class="small" style="line-height:1.6">' +
      '<li>Open <a href="https://business.facebook.com" target="_blank" rel="noopener">business.facebook.com</a> and create (or choose) your business.</li>' +
      '<li>Open <a href="https://developers.facebook.com/apps" target="_blank" rel="noopener">developers.facebook.com/apps</a> → <b>Create app</b> → use case <b>Connect with customers through WhatsApp</b> → choose your business → create.</li>' +
      '<li>In the app: <b>WhatsApp → API Setup</b>. Click <b>Add phone number</b> and verify it with the SMS code. Use a number that is <b>not</b> in the WhatsApp app on a phone (or remove it from the app first). Then copy the <b>Phone number ID</b> and the <b>WhatsApp Business Account ID</b> shown there into the boxes above.</li>' +
      '<li>Add a payment method: <a href="https://business.facebook.com/wa/manage/" target="_blank" rel="noopener">WhatsApp Manager</a> → <b>Overview / Billing</b> → <b>Add payment method</b>.</li>' +
      '<li>Make a permanent token: <b>business.facebook.com → Settings → Users → System users → Add</b> (role Admin). Click <b>Assign assets</b>: your app and your WhatsApp account, both with full control. ' +
      'Then <b>Generate new token</b> → choose your app → expiry <b>Never</b> → tick <b>whatsapp_business_messaging</b> and <b>whatsapp_business_management</b> → copy it into “Access token”. Click <b>Save and test</b>.</li>' +
      '<li>Make a message: WhatsApp Manager → <b>Message templates → Create template</b> (category Marketing or Utility). Write <b>{{1}}</b> where the person’s name goes and <b>{{2}}</b> for the shop name. ' +
      'Submit and wait for <b>Approved</b> (minutes to a day). Then click <b>Reload templates</b> here.</li>' +
      '</ol><p class="small muted">New business accounts can message about 250 people a day at first; Meta raises the limit when people respond well (and after business verification).</p></details></div>';
    return html;
  }

  function bindWaApiSettings(api) {
    if (!$('waSave')) return;
    $('waSave').addEventListener('click', function () {
      withBusy('Checking with Meta…', call('saveWhatsAppApi', { phoneNumberId: $('waPnid').value, wabaId: $('waWaba').value, token: $('waTok').value }))
        .then(function (r) { showBanner('success', '✓ Connected: ' + (r.verified_name || '') + ' ' + (r.display_phone || '') + '. Choose WhatsApp Business API on a shop’s WhatsApp tab to send.', true); renderSettings(); });
    });
    if ($('waReload')) $('waReload').addEventListener('click', function () {
      withBusy('Loading templates from Meta…', call('refreshWhatsAppTemplates')).then(function (r) { showBanner('success', 'Templates reloaded.'); drawTplList(r.templates); });
    });
    if ($('waDisc')) $('waDisc').addEventListener('click', function () {
      if (!confirm('Disconnect the WhatsApp Business API?\n\nThe token is deleted from the app and running WhatsApp API sends pause.')) return;
      withBusy('Disconnecting…', call('disconnectWhatsAppApi')).then(function (r) { showBanner('success', 'Disconnected' + (r.paused ? '. ' + plural(r.paused, 'running send') + ' paused.' : '.')); renderSettings(); });
    });
    if (api && api.configured && api.status === 'connected') call('getWhatsAppApiTemplates').then(function (r) { drawTplList(r.templates); }, function () {});
  }

  function drawTplList(list) {
    var box = $('waTplList'); if (!box) return;
    var ok = list.filter(function (t) { return t.status === 'APPROVED' && t.ok; });
    var other = list.filter(function (t) { return !(t.status === 'APPROVED' && t.ok); });
    box.innerHTML = '<p class="small" style="margin-top:12px"><b>Templates you can use (' + ok.length + '):</b> ' + (ok.length ? ok.map(function (t) { return esc(t.name) + ' <span class="muted">(' + esc(t.language) + ')</span>'; }).join(', ') : '<span class="muted">none approved yet</span>') + '</p>' +
      (other.length ? '<details class="small"><summary>' + other.length + ' other template' + (other.length === 1 ? '' : 's') + '</summary><ul>' + other.map(function (t) {
        return '<li>' + esc(t.name) + ' (' + esc(t.language) + '): ' + esc(t.status !== 'APPROVED' ? 'status ' + t.status.toLowerCase().replace(/_/g, ' ') : t.why) + '</li>';
      }).join('') + '</ul></details>' : '');
  }

  /** Connect a Gmail account: Google's page opens in this tab and comes back here to finish. */
  function connectAccount(hint) {
    withBusy('Preparing…', call('startGmailConnect', hint)).then(function (url) {
      var box = $('connectGo'); if (!box) return;
      box.innerHTML = '<div class="sched" style="margin-top:12px"><b>Connect ' + esc(hint || 'a Gmail account') + '</b>' +
        '<ol class="small" style="margin:6px 0 10px;padding-left:20px;line-height:1.6"><li>Click the button: Google opens in this tab.</li>' +
        '<li>Choose ' + (hint ? esc(hint) : 'the shop’s Gmail') + '. Google says it hasn’t verified the app: click <b>Advanced</b> → <b>Go to Shop Follow-ups</b>.</li>' +
        '<li>Tick <b>Send email on your behalf</b> and click <b>Continue</b>. You come back here and it is connected.</li></ol>' +
        googleLink('connectGoBtn', url, 'Continue to Google →', 'gmail', 'btn primary') + ' <button class="btn" id="connectCancel">Cancel</button></div>';
      bindGoogleLink('connectGoBtn');
      $('connectCancel').addEventListener('click', function () { box.innerHTML = ''; });
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }


  start();
})();
</script>
